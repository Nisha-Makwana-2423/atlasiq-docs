<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --card: #ffffff;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --card: #1e293b;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    footer { margin-top: 24px; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="status"><span class="dot"></span> Deployment successful</div>
    <h1>Hello, World 👋</h1>
    <p>This page is live. Replace this text with your own content.</p>
    <button id="btn">Click me</button>
    <footer id="time"></footer>
  </main>


  <script>
    let count = 0;
    document.getElementById("btn").addEventListener("click", (e) => {
      count++;
      e.target.textContent = Clicked ${count} time${count === 1 ? "" : "s"};
    });
    document.getElementById("time").textContent =
      "Loaded at " + new Date().toLocaleString();
  </script>
</body>
</html>
