<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>AtlasIQ Sign-in and Access</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{--bg:#f3f4f6;--panel:#ffffff;--ink:#14171c;--ink2:#4a525e;--ink3:#6b7380;--line:#dfe2e7;--line2:#c9ced6;--acc:#1668c8;--acc-ink:#ffffff;--chip:#eceef2;--sel:#e7f0fb;--shadow:0 1px 2px rgba(20,23,28,.06),0 8px 24px rgba(20,23,28,.06);
  --dA:#1668c8;--dB:#0e7490;--dC:#0b6e66;--dD:#5b3fc4;--dE:#4a6a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--panel:#181b20;--ink:#eef0f3;--ink2:#b3bac5;--ink3:#8d95a1;--line:#2a2f36;--line2:#3a414a;--acc:#6aa7ee;--acc-ink:#0d1117;--chip:#22262c;--sel:#1d2a3a;--shadow:none;color-scheme:dark;
  --dA:#6aa7ee;--dB:#4cc9e8;--dC:#4fbfb2;--dD:#a99af2;--dE:#9db5cf}}
:root[data-theme="dark"]{--bg:#101215;--panel:#181b20;--ink:#eef0f3;--ink2:#b3bac5;--ink3:#8d95a1;--line:#2a2f36;--line2:#3a414a;--acc:#6aa7ee;--acc-ink:#0d1117;--chip:#22262c;--sel:#1d2a3a;--shadow:none;color-scheme:dark;
  --dA:#6aa7ee;--dB:#4cc9e8;--dC:#4fbfb2;--dD:#a99af2;--dE:#9db5cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.sh-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.sh-in{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.sh-brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.sh-brand b{font-weight:600;font-size:17px;letter-spacing:-.01em}
.sh-brand span{color:var(--ink3);font-size:14px}
.sh-grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--chip);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sh-main{padding-block:24px 64px}
.h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{color:var(--ink2);max-width:72ch;margin:8px 0 0}
.kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
/* screen view */
.sv{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;margin-top:20px}
.slist{display:flex;flex-direction:column;gap:4px;position:sticky;top:84px;align-self:start}
.slist button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px 12px;cursor:pointer}
.slist button[aria-current="true"]{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.slist .no{font:600 12px/20px 'IBM Plex Mono',monospace;color:var(--ink3)}
.slist b{display:block;font-weight:600}
.slist small{display:block;color:var(--ink3);font-size:12px;line-height:1.4}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px 8px 8px;cursor:pointer;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.opt .lt{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font:600 13px/1 'IBM Plex Mono',monospace}
.opt b{font-weight:600}
.opt small{color:var(--ink3);font-size:12px;display:block;line-height:1.2}
.sv .opt > .col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.sv .opt .col small {
  text-align: center;
}
.sv .opt .lt {
  flex-shrink: 0;
}
.stagew{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stage{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#d9dde3}
.stage>.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.about{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:16px}
.about h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.about p,.about li{margin:0;color:var(--ink2)}
.about ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.vote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.vote .lb{color:var(--ink2);margin-right:4px}
.vb{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.vb[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.vb.pick[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.nav2{display:flex;gap:8px;margin-left:auto}
.ib{border:1px solid var(--line2);background:var(--panel);border-radius:10px;min-width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;padding:0 12px}
.hint{color:var(--ink3);font-size:12px}
.states{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.states .lb{color:var(--ink3);font-size:12px;margin-right:4px}
.sb2{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.sb2[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:600}
/* directions view */
.dirs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:20px}
.dcard{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.dcard[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.dcard .sw{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.dcard .sw i{flex:1}
.dcard b{font-size:16px}
.dcard small{color:var(--ink2);font-size:13px;line-height:1.4}
.manif{margin-top:20px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.manif h2{margin:0;font-size:24px;letter-spacing:-.01em}
.spec{display:flex;flex-direction:column;gap:12px}
.spec .row{display:flex;gap:8px;flex-wrap:wrap}
.spec .chipc{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink3)}
.spec .chipc i{display:block;width:56px;height:40px;border-radius:8px;border:1px solid var(--line)}
.prin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.prin div{border-top:2px solid var(--c);padding-top:10px}
.prin b{display:block;margin-bottom:4px}
.prin span{color:var(--ink2);font-size:13px}
.dstack{display:flex;flex-direction:column;gap:28px;margin-top:24px}
.dstack h3{margin:0 0 10px;font-size:16px}
/* compare */
.mx{margin-top:20px;overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.mx table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%;table-layout:fixed}
.mx th,.mx td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.mx thead th{position:sticky;top:0;background:var(--panel);font-weight:600}
.mx th.rh{width:150px}
.mx th .lt{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:#fff;font:600 12px/1 'IBM Plex Mono',monospace;margin-right:8px}
.thumb{display:block;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#d9dde3;padding:0;position:relative}
.thumb:hover,.thumb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.thumb .scaler{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.thumb .pk{position:absolute;right:6px;top:6px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.sbs .stagew{margin-top:0}
.sbs select{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;height:36px;padding:0 8px;font:inherit}
/* feedback */
.fb{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.fbr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.fbr h3{margin:0;font-size:15px}
.fbr .opts .opt{padding:6px 12px 6px 6px;min-height:40px}
.fbr textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.fbsum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.lean{display:flex;gap:8px;flex-wrap:wrap}
.lean span{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.lean i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.btnp{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;height:40px;padding:0 16px;font-weight:600;cursor:pointer}
.btns{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;height:40px;padding:0 16px;cursor:pointer}
.toast2{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40}
@media (max-width:1100px){.dirs{grid-template-columns:repeat(2,minmax(0,1fr))}.about{grid-template-columns:minmax(0,1fr)}.manif{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.sv{grid-template-columns:minmax(0,1fr)}.slist{position:static;flex-direction:row;overflow-x:auto}.slist button{min-width:180px}.sbs{grid-template-columns:minmax(0,1fr)}.fbr{grid-template-columns:minmax(0,1fr)}.prin{grid-template-columns:minmax(0,1fr)}}

/* every design option sits in a fixed 1440 x 900 desktop frame */
.dd{width:1440px;height:900px;overflow:hidden;position:relative;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;text-align:left}
.dd *{box-sizing:border-box}
.dd button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0;text-align:inherit}
.dd input,.dd textarea{font:inherit;color:inherit}
.dd h1,.dd h2,.dd h3,.dd p,.dd ul{margin:0;padding:0}
.dd ul{list-style:none}
.dd .ic{flex:none;display:block}
.dd .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dd .cond{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif}
.dd .serif{font-family:'IBM Plex Serif',Georgia,serif}
.dd .row{display:flex;align-items:center}
.dd .col{display:flex;flex-direction:column}
.dd .grow{flex:1;min-width:0}
.dd .nw{white-space:nowrap}
.dd .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a scanned page */
.dd .pg{width:420px;height:560px;background:#fff;color:#1b2230;padding:32px;display:flex;flex-direction:column;gap:12px;flex:none}
.dd .pg-h{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid #c3cbd6;font-size:12px;line-height:16px}
.dd .pg-h b{font-weight:600}
.dd .pg-rows{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.dd .pg-r{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;font-size:12px;line-height:18px;padding:2px 6px;border-radius:4px}
.dd .pg-r span{color:#596476}
.dd .pg-r b{font-weight:600;font-family:'IBM Plex Serif',Georgia,serif;font-style:italic}
.dd .pg-l{height:8px;border-radius:4px;background:#e6e9ee;flex:none}
.dd .pg-sig{margin-top:auto;align-self:flex-end;width:170px;padding-top:6px;border-top:1px solid #7f8b9c;text-align:center;font:italic 400 13px/18px 'IBM Plex Serif',Georgia,serif;color:#596476}

/* structure shared by options B to E; each direction sets its own look on top */
.dd.v2{height:auto;min-height:900px}
.dd.v2.fix{height:900px}
.dd .k-grow{flex:1}
.dd .k-app{display:flex;flex-direction:column;min-height:900px}
.dd.fix .k-app{height:900px}
.dd .k-h{display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;flex:none}
.dd .k-wm{font-weight:600;font-size:18px;margin-right:6px}
.dd .k-ws{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;font-size:13px;font-weight:500;white-space:nowrap}
.dd .k-search{display:flex;align-items:center;gap:10px;width:440px;height:40px;padding:0 12px;font-size:14px}
.dd .k-search span{flex:1;white-space:nowrap;overflow:hidden}
.dd kbd{font:500 12px/18px 'IBM Plex Mono',monospace;padding:0 6px;border-radius:4px}
.dd .k-ib{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;flex:none}
.dd .k-ib i{position:absolute;right:3px;top:3px;min-width:16px;height:16px;border-radius:8px;font:600 11px/16px 'IBM Plex Sans';font-style:normal;text-align:center;padding:0 4px}
.dd .k-ib.sq{width:32px;height:32px}
.dd .k-me{display:flex;align-items:center;gap:10px;margin-left:6px}
.dd .k-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.dd .k-mw{display:flex;flex-direction:column}
.dd .k-mw b{font-weight:600;font-size:14px;line-height:18px}
.dd .k-mw small{font-size:12px;line-height:16px}
.dd .k-body{flex:1;display:flex;min-height:0}
.dd .k-nav{width:232px;flex:none;display:flex;flex-direction:column;gap:2px;padding:12px}
.dd .k-ng{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.dd .k-ngl{font-size:12px;font-weight:500;padding:8px 12px 4px}
.dd .k-ni{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;font-weight:500;font-size:14px;white-space:nowrap}
.dd .k-ni span{flex:1}
.dd .k-ni em{font-style:normal;font-size:12px}
.dd .k-main{flex:1;min-width:0;padding:28px 40px 40px;display:flex;flex-direction:column;gap:20px}
.dd .k-ph{display:flex;align-items:flex-start;gap:16px}
.dd .k-pht{flex:1;display:flex;flex-direction:column;gap:4px}
.dd .k-ph h1{font-size:26px;line-height:34px;font-weight:600}
.dd .k-sub{font-size:14px;line-height:20px}
.dd .k-crumb{display:flex;gap:8px;font-size:14px;margin-bottom:4px}
.dd .k-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;font-weight:500;white-space:nowrap;border-radius:8px;flex:none}
.dd .k-btn.block{width:100%;height:48px}
.dd .k-ban{display:flex;align-items:center;gap:14px;padding:14px 18px}
.dd .k-bt{display:flex;flex-direction:column;gap:2px}
.dd .k-bt b{font-weight:600}
.dd .k-ban a{font-weight:500;margin-left:16px}
.dd .k-quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dd .k-ql{font-size:12px;margin-right:6px}
.dd .k-qb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;font-weight:500;font-size:13px}
.dd .k-th{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:-8px}
.dd .k-th a{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.dd .k-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dd .k-tile{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.dd .k-tl{display:flex;align-items:center;gap:6px;font-size:13px}
.dd .k-tv{display:flex;align-items:baseline;gap:10px}
.dd .k-tv b{font-size:28px;line-height:34px;font-weight:600}
.dd .k-tv small{font-size:12px;display:inline-flex;align-items:center;gap:4px}
.dd .k-ta{display:flex;align-items:center;justify-content:space-between;font-weight:500;font-size:14px}
.dd .k-card{display:flex;flex-direction:column;gap:14px;padding:20px 22px;min-width:0}
.dd .k-card.flush{padding:0;gap:0}
.dd .k-card.flush .k-ch{padding:18px 22px 14px}
.dd .k-ch{display:flex;align-items:center;gap:8px}
.dd .k-ch h2{font-size:17px;line-height:24px;font-weight:600}
.dd .k-ch a{font-weight:500;font-size:14px}
.dd .k-n{font-size:13px}
.dd .k-cs{font-size:13px;line-height:18px;margin-top:-8px}
.dd .k-lg{display:flex;gap:16px;font-size:12px;align-items:center}
.dd .k-lg span{display:inline-flex;align-items:center;gap:6px}
.dd .k-lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dd .k-qt{width:100%;border-collapse:collapse;font-size:13px}
.dd .k-qt th{text-align:left;font-weight:500;padding:6px 0;font-size:12px}
.dd .k-qt td{padding:5px 0;height:24px}
.dd .k-qt th:nth-child(2){width:38%}
.dd .k-qt .r,.dd .k-qt th:nth-child(3),.dd .k-qt th:nth-child(4){text-align:right;width:64px}
.dd .k-bar{position:relative;display:block;height:8px;border-radius:4px;margin:0 10px}
.dd .k-bar i,.dd .k-bar em{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.dd .k-chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.dd .k-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.dd .k-col i{display:block;width:100%;border-radius:4px 4px 0 0}
.dd .k-tbl{width:100%;border-collapse:collapse;font-size:14px}
.dd .k-tbl th{text-align:left;font-weight:500;font-size:12px;height:36px;padding:0 14px}
.dd .k-tbl td{padding:9px 14px;vertical-align:middle}
.dd .k-tbl td small{display:block;font-size:12px}
.dd .k-tbl .r{text-align:right}
.dd .k-ov{display:inline-flex;align-items:center;gap:4px}
.dd .k-st{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dd .k-list{display:flex;flex-direction:column}
.dd .k-list li{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
.dd .k-list li:first-child{padding-top:0}
.dd .k-list li>.ic{margin-top:1px;flex:none}
.dd .k-lt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}

/* ================= the guidelines view in the presentation shell ================= */
.gd-sec{margin-top:28px}
.gd-h{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.gd-tw{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.gd-t{width:100%;border-collapse:collapse;min-width:720px}
.gd-t th,.gd-t td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.gd-t th{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.gd-t tr:last-child td{border-bottom:0}
.gd-t td.mono,.gd-chip .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
.gd-sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gd-ok{color:var(--ink);font-weight:500}
.gd-lo{color:var(--gd-warn);font-weight:600}
.gd-chips{display:flex;flex-direction:column;gap:8px}
.gd-chip{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.gd-chip i{grid-row:span 2;width:28px;height:28px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gd-chip small{grid-column:2/4;color:var(--ink3);font-size:12px}
.gd-g2,.gd-g3,.gd-g4{display:grid;gap:12px;margin-top:12px}
.gd-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gd-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gd-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gd-b{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.gd-b h3{margin:0 0 8px;font-size:15px}
.gd-b p{margin:0;color:var(--ink2)}
.gd-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.gd-b ul.gd-kv{list-style:none;padding:0;gap:8px}
.gd-kv li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px}
.gd-kv li:first-child{border-top:0;padding-top:0}
.gd-kv b{font-weight:600;color:var(--ink)}
.gd-kv span{text-align:right}
.gd-note{margin-top:10px!important;font-size:13px}
.gd-do{border-top:3px solid var(--gd-ok)}
.gd-dont{border-top:3px solid var(--gd-warn)}
:root{--gd-ok:#17603f;--gd-warn:#a3272f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gd-ok:#5fd4a0;--gd-warn:#ff9e9e}}
:root[data-theme="dark"]{--gd-ok:#5fd4a0;--gd-warn:#ff9e9e}
@media (max-width:1100px){.gd-g3,.gd-g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.gd-g2,.gd-g3,.gd-g4{grid-template-columns:minmax(0,1fr)}.gd-kv li{flex-direction:column;gap:2px}.gd-kv span{text-align:left}}

/* Consistent palette styling for all five options */
.dd .gs-pal {
  border-radius: 10px;
  overflow: hidden;
  clip-path: inset(0 round 10px);
  isolation: isolate;
  border: 1px solid rgba(0, 0, 0, 0.10);
}

.dd .gs-pal i {
  display: block;
  flex: 0 0 56px;
  height: 56px;
  box-shadow: none;
}
.dd .gs-ask,.dd .gs-ql{display:flex;flex-direction:column;gap:12px}
.dd .gs-ql .k-quick{flex-direction:column;align-items:flex-start}

/* level column bottoms on every home screen: rows stretch, the last card in a column takes up the remaining height */
.dd.v2 .k-main>:is(.p-g,.b-g3,.b-g3b,.b-g4,.b-g2,.b-g3p,.c-g,.d-g,.d-g3,.e-g,.e-g2){align-items:stretch}
.dd.v2 .k-main>:is(.p-g,.b-g3,.c-g,.d-g,.d-g3,.e-g)>:is(.p-c,.b-stack,.c-col,.d-col,.e-col){display:flex;flex-direction:column}
.dd.v2 .k-main>:is(.p-g,.b-g3,.c-g,.d-g,.d-g3,.e-g)>:is(.p-c,.b-stack,.c-col,.d-col,.e-col)>*{flex:1 0 auto}
.dB .b-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dd.v2 .k-main>:is(.b-g3b,.b-g4,.b-g2,.e-g2)>.k-card{height:auto}

@media (min-width: 1350px) {
  .sv .opts {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    width: 100%;
  }

  .sv .opt {
    min-width: 0;
    gap: 6px;
    padding: 8px;
  }

  .sv .opt .lt {
    flex: none;
  }

  .sv .opt .col {
    min-width: 0;
  }

  .sv .opt small {
    overflow-wrap: anywhere;
  }
}

/* ===================================================================================================
   Theme guidelines: one set of standards per option, taken from the values the screens actually use.
   The sheet (DIRS.X.s.guide) is built from the same classes as the screens, so it cannot drift.
   =================================================================================================== */
const lum = h => { const c = h.replace('#', '').match(/../g).map(x => parseInt(x, 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4)); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const cr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
/* kind t = text (4.5:1 needed), n = control edge or icon (3:1 needed), s = surface (no contrast rule) */
const crTag = (k, f, b) => { if (k === 's') return ''; const r = cr(f, b), need = k === 't' ? 4.5 : 3; return `${r.toFixed(1)}:1 ${r >= (k === 't' ? 7 : need) && k === 't' ? 'AAA' : r >= need ? 'AA' : 'Below ' + need + ':1'}`; };

const AU = {live: false};
const ae = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
const aa = (o, k) => o[k] ? ` ${k.replace(/_/g, '-')}="${ae(o[k])}"` : '';

const A = {

  inp(o) {

    const cls = 'k-in au-in' + (o.mono ? ' au-mono' : '') + (o.err ? ' au-err' : '') + (o.on ? ' on' : '') + (o.fixed ? ' au-fixed' : '') + (pw ? ' au-pw' : '') + (o.w ? ' au-w' + o.w : '');

    const eye = pw && has ? `<button type="button" class="au-eye" data-act="eye" data-arg="${o.name}" aria-label="${o.show ? 'Hide password' : 'Show password'}" aria-pressed="${o.show ? 'true' : 'false'}" title="${o.show ? 'Hide password' : 'Show password'}">${ic(o.show ? 'eye' : 'eyeoff', 20)}</button>` : '';
    const lock = o.fixed ? ic('lock', 16, 'au-fl') : '';
    if (AU.live && !o.fixed) {

      const t = pw ? (o.show ? 'text' : 'password') : (o.type === 'email' ? 'text' : o.type || 'text');
      return `<span class="${cls}"><input class="au-ctl" id="f-${o.name}" name="${o.name}" data-bind="${o.name}" type="${t}" value="${ae(o.val)}"${o.ph ? ` placeholder="${ae(o.ph)}"` : ''}${o.ac ? ` autocomplete="${o.ac}"` : ''}${o.type === 'email' ? ' inputmode="email"' : o.im ? ` inputmode="${o.im}"` : ''}${o.max ? ` maxlength="${o.max}"` : ''}${o.req ? ' aria-required="true"' : ''}${o.err ? ' aria-invalid="true"' : ''} aria-describedby="h-${o.name} e-${o.name}" spellcheck="false" autocapitalize="off">${eye}</span>`;

    return `<div class="au-f${o.cls ? ' ' + o.cls : ''}"><div class="au-lr"><span class="au-lw"><label class="au-l" for="f-${o.name}">${lab}</label>${o.tip ? A.tip(o.tip, {open: o.tipOpen, id: 't-' + o.name}) : ''}</span>${o.right || ''}</div>${o.hint ? `<p class="au-h" id="h-${o.name}">${o.hint}</p>` : ''}${o.inner || A.inp(o)}${o.err && o.err !== true ? A.errMsg(o.err, o.name) : ''}${o.ok ? `<p class="au-okm" id="e-${o.name}">${ic('check', 16)}<span>${o.ok}</span></p>` : ''}${o.below ? `<div class="au-below">${o.below}</div>` : ''}</div>`;

  },
  /* a whole-row button that leads somewhere (Try another way) */
  rowBtn: (icon, title, sub, act, arg, side) => `<button type="button" class="au-rb" data-act="${act}"${arg ? ` data-arg="${arg}"` : ''}><span class="au-chi">${ic(icon, 22)}</span><span class="au-cht"><b>${title}</b><small>${sub}</small></span>${side || ''}${ic('arrow', 20, 'au-ra')}</button>`,

  /* ---------- actions ---------- */
  btn(t, o = {}) {
    const k = o.kind || 'p', wid = o.why && o.dis ? 'why-' + (o.act || 'b') : '';
    const b = `<button type="button" class="k-btn ${k}${o.block === false ? '' : ' block'}${o.sm ? ' sm' : ''}${o.cls ? ' ' + o.cls : ''}" data-act="${o.act || ''}"${o.arg ? ` data-arg="${ae(o.arg)}"` : ''}${o.dis ? ' disabled aria-disabled="true"' : ''}${wid ? ` aria-describedby="${wid}"` : ''}>${o.icon ? ic(o.icon, 18) : ''}<span>${t}</span>${o.trail ? ic(o.trail, 18) : ''}</button>`;
    /* a disabled button says why, right under it */
    return wid ? `<div class="au-bw">${b}<p class="au-why" id="${wid}">${ic('info', 16)}<span>${o.why}</span></p></div>` : b;
  },
  link: (t, act, arg) => `<a class="au-a" href="#" data-act="${act || ''}"${arg ? ` data-arg="${ae(arg)}"` : ''}>${t}</a>`,
  /* a text button (acts, never navigates away) */
  tbtn: (t, act, o = {}) => `<button type="button" class="au-tb" data-act="${act}"${o.arg ? ` data-arg="${ae(o.arg)}"` : ''}${o.dis ? ' disabled' : ''}>${o.icon ? ic(o.icon, 16) : ''}<span>${t}</span></button>`,
  back: (t, act, arg) => `<a class="au-back" href="#" data-act="${act}"${arg ? ` data-arg="${ae(arg)}"` : ''}>${ic('back', 18)}<span>${t || 'Back'}</span></a>`,
  resend: (sec, act, t) => sec > 0 ? `<button type="button" class="au-tb" disabled>${ic('clock', 16)}<span>${t} in 0:${String(sec).padStart(2, '0')}</span></button>` : A.tbtn(t, act, {icon: 'refresh'}),

  /* ---------- messages and status ---------- */

  alert(kind, title, body, act) {
    const icon = {info: 'info', ok: 'check', warn: 'triangle', err: 'triangle', lock: 'lock'}[kind];
    return `<div class="au-al ${kind}" role="${kind === 'err' ? 'alert' : 'status'}"><span class="au-ali">${ic(icon, 20)}</span><div class="au-alt"><b>${title}</b>${body ? `<span>${body}</span>` : ''}${act ? `<div class="au-ala">${act}</div>` : ''}</div></div>`;
  },
  /* AtlasIQ speaking: the AI tag, what it found, optional actions, and where it came from */
  ai: (tag, text, src, acts) => `<div class="ai-note au-ai"><span class="ai-tag">${ic('sparkle', 14)}${tag}</span><p class="ai-tx">${text}</p>${acts ? `<div class="au-row">${acts}</div>` : ''}${src ? `<p class="ai-src">${ic('info', 14)}<span>${src}</span></p>` : ''}</div>`,
  tile: (icon, tone) => `<span class="au-tile ${tone}">${ic(icon, 28)}</span>`,
  badge: (k, t, i) => P.sb(k, t, i),
  /* the password rules, ticked as they are met. r: [[text, state]] with state ok, no or '' */
  rules: (r, title = 'Your password needs') => `<div class="au-rules" id="h-pw" aria-live="polite"><p>${title}</p><ul>${r.map(([t, s]) => `<li class="${s}">${s === 'ok' ? ic('check', 16) : s === 'no' ? ic('x', 16) : '<i class="au-rd0"></i>'}<span>${t}</span></li>`).join('')}</ul></div>`,
  pwRules(pw, o = {}) {
    const R = AUD.rules, v = pw || '', sub = !!o.submitted;
    const st = ok => ok ? 'ok' : (sub ? 'no' : '');
    const L = [[`At least ${R.len} characters`, st(v.length >= R.len)], ['Upper and lower case letters', st(/[a-z]/.test(v) && /[A-Z]/.test(v))], ['At least one number', st(/\d/.test(v))], ['At least one symbol, such as ! or #', st(/[^A-Za-z0-9]/.test(v))]];
    if (o.history) L.push([`Not one of your last ${R.history} passwords`, sub || v.length >= R.len ? 'ok' : '']);
    L.push(['Not found in known data breaches (checked when you save)', '']);
    return L;
  },
  pwOk: pw => A.pwRules(pw).slice(0, 4).every(x => x[1] === 'ok'),
  /* new password and its confirmation: both fields, the rules between them, and the match shown as you type */
  pwPair(v, o = {}) {
    const pw = v.pw || '', pw2 = v.pw2 || '';
    const mism = pw2 && (pw2 !== pw) && (pw2.length >= pw.length || v.submitted);
    return A.field({name: 'pw', label: o.label || 'New password', req: true, type: 'password', val: pw, show: v.show, ph: o.ph || 'Enter a new password', ac: 'new-password', on: v.focus === 'pw' || (!pw && !v.focus)}) +
      A.rules(A.pwRules(pw, {history: o.history, submitted: v.submitted})) +
      A.field({name: 'pw2', label: o.label2 || 'Confirm new password', req: true, type: 'password', val: pw2, show: v.show2, ph: o.ph2 || 'Re-enter the new password', ac: 'new-password', on: v.focus === 'pw2', err: mism ? 'The passwords don\'t match. Re-enter the new password.' : '', ok: pw2 && pw2 === pw && A.pwOk(pw) ? 'Passwords match' : ''});

  facts: L => `<ul class="au-facts">${L.map(([i, t]) => `<li>${ic(i, 18)}<span>${t}</span></li>`).join('')}</ul>`,

  who: (email, act) => `<div class="au-who"><span class="au-wa">${ic('user', 18)}</span><span class="au-we">${ae(auMaskEmail(email))}</span>${act ? A.tbtn('Change', act) : ''}</div>`,

  codes: () => `<div class="au-codes" aria-label="Recovery codes"><ol>${AUD.codes.map(c => `<li>${c}</li>`).join('')}</ol></div>`,
  divider: t => t ? `<div class="au-div"><i></i><span>${t}</span><i></i></div>` : '<hr class="au-hr">',
  /* a scannable code for the authenticator app (a drawing, not a real code) */
  qr() {
    let s = '', seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const N = 25, c = 6;
    const finder = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="currentColor"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="currentColor"/>`;
    const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > 0.52) s += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}"/>`;
    return `<span class="au-qr" role="img" aria-label="QR code for AtlasIQ"><svg viewBox="0 0 ${N * c} ${N * c}" width="150" height="150" fill="currentColor">${s}${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg></span>`;
  },
  /* modal dialog over a page */
  modal: (o) => `<div class="au-scrim"><div class="au-mod${o.wide ? ' wide' : ''}" role="${o.alert ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="m-t"><div class="au-mb">${o.tile || ''}<h2 id="m-t">${o.title}</h2>${o.body}</div><div class="au-mf">${o.foot}</div></div></div>`
};

  foot: () => `<footer class="au-ft"><span>${ic('lock', 16)}Every sign-in is recorded to protect patient information.</span><nav aria-label="Legal">${A.link('Accessibility', 'later')}${A.link('Privacy', 'later')}${A.link('Terms of use', 'later')}</nav></footer>`,
  /* a public page: header, the main area, the footer */
  page: (o) => `<div class="au-pg"><header class="au-hd">${GL.logo}${o.ctx ? `<span class="au-ctx">${o.ctx}</span>` : ''}<span class="k-grow"></span>${o.help === false ? '' : GL.help(o.helpText)}</header><main class="au-mn${o.mcls ? ' ' + o.mcls : ''}">${o.main}</main>${GL.foot()}</div>`,
  card: (body, cls = '') => `<section class="au-card${cls ? ' ' + cls : ''}">${body}</section>`,
  head: (title, sub, kick) => `<div class="au-ttl">${kick ? `<p class="au-kick">${kick}</p>` : ''}<h1>${title}</h1>${sub ? `<p class="au-lead">${sub}</p>` : ''}</div>`,
  stack: (...x) => `<div class="au-st">${x.filter(Boolean).join('')}</div>`,
  row: (...x) => `<div class="au-row">${x.filter(Boolean).join('')}</div>`,
  /* the side panel: the clear next step for anyone who doesn't sign in here */
  aside: (body) => `<aside class="au-side">${body}</aside>`,
  split: (card, aside) => `<div class="au-split">${card}${aside}</div>`,
  /* registration: the six steps on the left of the card */
  regSteps: ['Your agency', 'About you', 'Verify your email', 'Create a password', 'Two-step verification', 'Authorized representatives'],
  rail(step) {
    return `<div class="au-rail"><p class="au-kick">Register your agency</p><div class="au-pbar" aria-hidden="true">${GL.regSteps.map((s, i) => `<i class="${i < step ? 'on' : ''}"></i>`).join('')}</div><ol class="au-steps">${GL.regSteps.map((s, i) => `<li class="${i + 1 < step ? 'done' : i + 1 === step ? 'on' : ''}"${i + 1 === step ? ' aria-current="step"' : ''}><span>${i + 1 < step ? ic('check', 14) : i + 1}</span>${s}</li>`).join('')}</ol></div>`;
  },
  reg(step, body, o = {}) {
    const top = `<div class="au-rtop">${o.noBack ? '<span></span>' : step > 1 ? A.back('Back', o.back || 'reg-back') : A.back('Back to sign in', 'go-signin')}<p class="au-stepn">Step ${step} of 6</p></div>`;
    const card = `<section class="au-card au-regc">${GL.rail(step)}<div class="au-rf">${top}${body}</div></section>`;
    return GL.page({ctx: 'Register your agency', main: o.ready ? GL.split(card, GL.aside(o.ready)) : `<div class="au-split one">${card}</div>`, mcls: 'au-mreg'});
  },
  /* the provider workspace after sign-in (the Guided app shell), with locked areas marked */
  provNav(cur, locked) {
    const L = [[null, [['home', 'Home', 'home'], ['claims', 'Claim status', 'claims', 1], ['upload', 'Upload records', 'upload', 1], ['letter', 'Letters', 'letters', 1], ['chat', 'Chat assistant', 'chat', 1], ['training', 'Training', 'training'], ['support', 'Support', 'support']]], ['Your agency', [['users', 'Representatives', 'reps'], ['bell', 'Alert settings', 'alerts']]]];
    return `<nav class="k-nav" aria-label="Main">${L.map(([g, items]) => `<div class="k-ng">${g ? `<p class="k-ngl">${g}</p>` : ''}${items.map(([i, t, k, lk]) => `<a class="k-ni${k === cur ? ' on' : ''}" data-act="pnav" data-arg="${k}">${k === cur ? '<i class="p-mk"></i>' : ''}${ic(i, 18)}<span>${t}</span>${lk && locked ? `<em class="au-lk" title="Opens once your representative is verified">${ic('lock', 14)}</em>` : ''}</a>`).join('')}</div>`).join('')}<span class="k-grow"></span><a class="k-ni k-collapse">${ic('sidebar', 18)}<span>Collapse menu</span></a></nav>`;
  },
  app(p, cur, main, o = {}) {
    const X = {ctx: o.ctx || 'NC Medicaid', search: 'Search a claim number, recipient ID or letter', who: {name: p.name, role: (p.role || 'Owner') + ' · ' + p.org, n: o.n == null ? 0 : o.n}};
    let head = P.head(X, {logo: GL.logo});
    if (!X.who.n) head = head.replace(/<i>0<\/i>/, '').replace('Alerts, 0 new', 'Alerts');
    if (o.locked) head = head.replace(/<div class="k-search">[\s\S]*?<\/div>/, `<div class="k-search au-dis" aria-disabled="true">${ic('lock', 18)}<span>Search unlocks once your agency is fully verified</span></div>`);
    return `<div class="k-app p-app au-app">${head}<div class="k-body">${GL.provNav(cur, o.locked)}<main class="k-main">${main}</main></div></div>`;
  }
};

const DL = {   /* Copilot: CQH staff */
  logo: (inv) => `<span class="k-wm${inv ? ' inv' : ''}"><i class="d-logo">${ic('sparkle', 18)}</i>AtlasIQ</span>`,
  help: () => `<p class="au-help">Trouble signing in? ${A.link('Contact IT support', 'support')}</p>`,
  foot: () => `<footer class="au-ft"><span>${ic('lock', 16)}For CQH staff. Every sign-in is recorded.</span><nav aria-label="Legal">${A.link('Accessibility', 'later')}${A.link('Privacy', 'later')}${A.link('Acceptable use', 'later')}</nav></footer>`,
  page: (o) => `<div class="au-pg au-dpg"><header class="au-hd">${DL.logo(true)}<span class="au-ctx">Staff sign-in</span><span class="k-grow"></span>${DL.help()}</header><main class="au-mn${o.mcls ? ' ' + o.mcls : ''}">${o.main}</main>${DL.foot()}</div>`,

  /* AtlasIQ speaking: the AI tag and the serif voice */

  /* the side column on the staff pages: a short written status of AtlasIQ itself */

};

/* ===================================================================================================
   Guided: the sign-in and access screens for providers, customers and external partners.
   Intent: a simple, step-by-step experience. One clear next step per page, numbered steps where order
   matters, plain full sentences, generous spacing.
   Rules every screen follows:
   - Navigation sits at the top left of the card: "Back to sign in" when it returns to the sign-in page,
     "Back" when it returns to the previous step.
   - Required fields are marked *, and the main button stays disabled, with the reason under it, until
     what it needs is filled in.
   - Email addresses and phone numbers shown back to someone signing in are partly hidden.
   - Two-step verification uses an authenticator app. At sign-in, Try another way offers the app, a
     one-time code by email, or a recovery code.
   =================================================================================================== */
const AUS = {};
const auDef = (id, o) => { AUS[id] = Object.assign({id}, o); };
const R_ = AUD.rules;
const auDig = s => String(s || '').replace(/\D/g, '');
const auTop = (t, act, arg) => `<div class="au-navt">${A.back(t, act, arg)}</div>`;

/* ---------- signing in ---------- */
const gSignAside = () => GL.aside(`<div class="au-next"><span class="au-ni">${ic('building', 22)}</span><div class="au-nt"><b>New to AtlasIQ?</b><span>Register your agency to upload records, check claim status and contact CQH about your review.</span></div>${A.btn('Register your agency', {kind: 's', act: 'go', arg: 'g-r1', trail: 'arrow'})}</div>` +
  `<div class="au-next sm"><span class="au-ni">${ic('mail', 22)}</span><div class="au-nt"><b>Invited by CQH?</b><span>Customers and partners: open your invitation email and select Accept invitation to create your account.</span></div></div>` +
  `<div class="au-next sm"><span class="au-ni">${ic('idcard', 22)}</span><div class="au-nt"><b>CQH staff</b><span>Sign in with your CQH account on the ${A.link('staff sign-in page', 'go', 'd-signin')}.</span></div></div>`);
auDef('g-signin', {t: 'G', group: 'Sign in', title: 'Sign in', render: v => {
  const e = v.err || {};
  let msg = '';
  if (v.msg === 'wrong') msg = A.alert('err', 'The email address or password is incorrect', 'Please check both and try again. Passwords are case-sensitive.');
  if (v.msg === 'last') msg = A.alert('warn', 'The email address or password is incorrect', `You have 1 attempt remaining. After that, your account will be temporarily locked for ${R_.lockMin} minutes.`, A.link('Reset your password instead', 'forgot-now'));
  if (v.msg === 'staff') msg = A.alert('info', 'This is a CQH work email address', 'CQH staff sign in with their CQH account on the staff sign-in page. Please don\'t enter your CQH work password on this page.', A.btn('Go to staff sign-in', {kind: 's', act: 'go', arg: 'd-signin', block: false, sm: true, trail: 'arrow'}));
  if (v.msg === 'out') msg = A.alert('info', 'You\'ve signed out', 'You can sign in again whenever you\'re ready.');
  const ready = !!(String(v.email || '').trim() && v.pw);
  const card = GL.card(GL.stack(GL.head('Sign in to AtlasIQ', 'Use the email address and password for your AtlasIQ account.', 'Providers, customers and partners'), msg,
    A.field({name: 'email', label: 'Email address', req: true, type: 'email', val: v.email, ph: 'Enter your email address', ac: 'username', err: e.email, on: v.focus === 'email'}),
    A.field({name: 'pw', label: 'Password', req: true, type: 'password', val: v.pw, show: v.show, ph: 'Enter your password', ac: 'current-password', err: e.pw, on: v.focus === 'pw', below: A.link('Forgot your password?', 'forgot')}),
    A.cb({name: 'remember', on: v.remember, text: 'Remember my email address on this device', hint: 'Don\'t use this on a shared or public computer.'}),
    A.btn('Sign in', {act: 'signin', dis: !ready, why: 'Enter your email address and password to sign in.'}),
    `<p class="au-note">${ic('app', 18)}<span>Next, you'll enter a code from your authenticator app.</span></p>`), 'au-sign');
  return GL.page({ctx: 'Sign in', main: GL.split(card, gSignAside())});
}});
/* a status page: one card, centered */
const gSolo = (body, ctx = 'Sign in') => GL.page({ctx, main: `<div class="au-split one">${GL.card(body, 'au-solo')}</div>`});
const gContact = () => `<div class="au-contact"><b>Contact CQH provider support</b><ul><li>${ic('phone', 18)}<span>${AUD.support.phone}, Monday to Friday, 8 AM to 5 PM ET</span></li><li>${ic('mail', 18)}<span>${AUD.support.email}</span></li></ul></div>`;
auDef('g-locked', {t: 'G', group: 'Sign in', title: 'Account temporarily locked', render: v => {
  const m = auMaskEmail(v.email), code = v.kind === 'code';
  return gSolo(GL.stack(auTop('Back to sign in', 'go-signin'), A.tile('lock', 'mute'),
    GL.head('Your account is temporarily locked', code ? `For your security, we've locked the account for ${ae(m)} after ${R_.attempts} incorrect verification codes. You can try again at 10:42 AM ET, in ${R_.lockMin} minutes.` : `For your security, we've locked the account for ${ae(m)} after ${R_.attempts} unsuccessful sign-in attempts. You can try again at 10:42 AM ET, in ${R_.lockMin} minutes.`),
    code ? `<p class="au-p">If you no longer have access to your authenticator app, CQH provider support can confirm your identity and reset your two-step verification.</p>` + gContact()
      : A.btn('Email me a password reset link', {act: 'send-reset', icon: 'mail'}) + `<p class="au-cap">We'll send the link to ${ae(m)}. Resetting your password unlocks your account right away.</p>`,
    code ? '' : A.divider(), code ? '' : `<p class="au-p">If you didn't try to sign in, please ${A.link('contact support', 'support')} so we can help secure your account.</p>`));
}});
auDef('g-suspended', {t: 'G', group: 'Sign in', title: 'Access suspended', render: v => gSolo(GL.stack(auTop('Back to sign in', 'go-signin'), A.tile('pause', 'mute'),
  GL.head('Your agency\'s access is suspended', `CQH has suspended AtlasIQ access for ${ae(v.p.org)}, so you can't sign in at the moment. Your records and claims are safe and haven't been changed.`),
  `<p class="au-p">To find out more, or to ask for access to be restored, please contact CQH provider support.</p>`, gContact()))});
auDef('g-closed', {t: 'G', group: 'Sign in', title: 'Account closed', render: v => gSolo(GL.stack(auTop('Back to sign in', 'go-signin'), A.tile('x', 'mute'),
  GL.head('This account is closed', `The AtlasIQ account for ${ae(auMaskEmail(v.p.email))} was closed on October 2, 2026. If your agency needs access again, please contact CQH provider support.`),
  gContact()))});

/* ---------- two-step verification at sign-in ---------- */
const APP_TIP = 'An authenticator app, such as Microsoft Authenticator or Google Authenticator, shows a new 6-digit code for AtlasIQ every 30 seconds.';
const gCodeErr = (method, err) => ({
  app: {wrong: 'That code isn\'t correct. Codes change every 30 seconds, so enter the code your authenticator app shows now.'},
  email: {wrong: 'That code isn\'t correct. Check the most recent email from AtlasIQ and try again.', expired: 'That code has expired. Select Send a new code, then enter the new code.'},
  setup: {wrong: 'That code isn\'t correct. Enter the 6-digit code your authenticator app shows for AtlasIQ now.'},
  verify: {wrong: 'That code isn\'t correct. Check the most recent email from AtlasIQ and try again.', expired: 'That code has expired. Select Send a new code, then enter the new code.'}
}[method] || {})[err] || '';
auDef('g-code', {t: 'G', group: 'Two-step verification', title: 'Verification code', render: v => {
  const email = v.method === 'email', p = v.p || AUD.denise, m = auMaskEmail(p.email);
  const banner = v.banner === 'reset' ? A.alert('ok', 'Your password has been changed', 'Enter your verification code to finish signing in. Any other devices signed in to this account have been signed out.') : '';
  const err = gCodeErr(email ? 'email' : 'app', v.err);
  const hint = email ? `The code expires in ${R_.codeMin} minutes. If you don't see the email, check your junk or spam folder.` : 'The code changes every 30 seconds.';
  return gSolo(GL.stack(auTop('Back to sign in', banner ? 'go-signin' : 'go-signin-pw'), banner, GL.head(email ? 'Enter the code we emailed you' : 'Enter the code from your authenticator app', email ? `We've sent a 6-digit code to ${ae(m)}.` : 'Open the authenticator app on your phone and enter the 6-digit code shown for AtlasIQ.', 'Two-step verification'),
    `<div class="au-f"><div class="au-lr"><span class="au-lw"><span class="au-l" id="l-code">6-digit code${A.req()}</span>${email ? '' : A.tip(APP_TIP, {id: 't-code'})}</span></div>${A.otp(v.code, !!err)}${err ? A.errMsg(err, 'code') : `<p class="au-h">${hint}</p>`}</div>`,
    A.btn('Verify and sign in', {act: 'verify', dis: auDig(v.code).length < 6, why: 'Enter all 6 digits to continue.'}),
    `<div class="au-row ${email ? 'sp' : 'end'}">${email ? A.resend(v.resend, 'resend', 'Send a new code') : ''}${A.tbtn('Try another way', 'go', {arg: 'g-another', icon: 'key'})}</div>`), 'Sign in');
}});
auDef('g-another', {t: 'G', group: 'Two-step verification', title: 'Try another way', render: v => {
  const p = v.p || AUD.denise, cur = v.cur || 'app';
  const tag = k => cur === k ? `<span class="au-curt">${A.badge('info', 'Current method', '')}</span>` : '';
  return gSolo(GL.stack(auTop('Back', 'go-code'),
    GL.head('Choose another way to verify', 'Select the option that works for you right now.', 'Two-step verification'),
    `<div class="au-rbs">${A.rowBtn('app', 'Authenticator app', 'Enter the 6-digit code from your authenticator app', 'pick-method', 'app', tag('app'))}${A.rowBtn('mail', 'Email code', `Send a one-time code to ${ae(auMaskEmail(p.email))}`, 'pick-method', 'email', tag('email'))}${A.rowBtn('key', 'Recovery code', 'Enter one of the one-time recovery codes you saved during setup', 'go', 'g-recovery')}</div>`,
    A.divider(), `<div class="au-pair"><b>Can't use any of these?</b><span>CQH provider support can confirm your identity and reset your two-step verification. ${A.link('Contact support', 'support')}</span></div>`), 'Sign in');
}});
auDef('g-recovery', {t: 'G', group: 'Two-step verification', title: 'Recovery code', render: v => {
  const n = String(v.rc || '').replace(/[^A-Za-z0-9]/g, '').length;
  return gSolo(GL.stack(auTop('Back', 'go', 'g-another'),
    GL.head('Enter a recovery code', 'Enter one of the recovery codes you saved when you set up your account. Each code can be used only once.', 'Two-step verification'),
    A.field({name: 'rc', label: 'Recovery code', req: true, tip: 'Recovery codes are 8 letters and numbers, such as 7KQ2-M9XD. You received 10 of them when you set up two-step verification.', val: v.rc, mono: true, ph: 'XXXX-XXXX', hint: 'Dashes and spaces are optional.', err: v.err ? 'That recovery code isn\'t correct, or it has already been used. Check the code and try again.' : '', on: !v.rc && !v.err}),
    A.btn('Verify and sign in', {act: 'verify-rc', dis: n < 8, why: 'Enter all 8 characters of the recovery code.'}),
    `<p class="au-cap">After you sign in, you'll have ${R_.codes - 1} recovery codes left. You can create a new set from your profile at any time.</p>`), 'Sign in');
}});
auDef('g-expired', {t: 'G', group: 'Sign in', title: 'Password expired', render: v => gSolo(GL.stack(auTop('Back to sign in', 'go-signin'), A.tile('key', 'warn'),
  GL.head('Your password has expired', `For your security, passwords for this account must be changed every ${R_.expiry} days. Create a new password to continue.`),
  A.pwPair(v, {history: true}),
  A.btn('Save new password and continue', {act: 'save-expired', dis: !A.pwReady(v), why: 'Meet every password rule and confirm the new password to continue.'})))});

/* ---------- forgot password ---------- */
auDef('g-forgot', {t: 'G', group: 'Forgot password', title: 'Reset your password', render: v => gSolo(GL.stack(auTop('Back to sign in', 'go-signin'),
  GL.head('Reset your password', 'Enter the email address linked to your AtlasIQ account. We\'ll send you a link to create a new password.', 'Forgot password'),
  A.field({name: 'email', label: 'Email address', req: true, type: 'email', val: v.email, ph: 'Enter your email address', ac: 'username', err: v.err, on: !v.email}),
  A.btn('Send reset link', {act: 'send-reset', icon: 'mail', dis: !String(v.email || '').trim(), why: 'Enter your email address to continue.'}),
  A.divider(), `<p class="au-cap au-staffr">${ic('idcard', 16)}<span>Are you CQH staff? Your work password is managed by CQH. ${A.link('Reset your CQH work password', 'staff-reset')} with CQH's self-service password reset.</span></p>`), 'Forgot password')});
auDef('g-sent', {t: 'G', group: 'Forgot password', title: 'Check your email', render: v => gSolo(GL.stack(auTop('Back to sign in', 'go-signin'), A.tile('mail', 'info'),
  GL.head('Check your email', `If an account exists for ${ae(auMaskEmail(v.email))}, we've sent a link to reset its password.`),
  A.facts([['clock', `The link can be used once and expires in ${R_.linkMin} minutes.`], ['mail', 'If you don\'t see the email, check your junk or spam folder.']]),
  `<div class="au-row sp">${A.resend(v.resend, 'resend-link', 'Resend the link')}${A.tbtn('Use a different email address', 'go', {arg: 'g-forgot'})}</div>`), 'Forgot password')});
auDef('g-newpw', {t: 'G', group: 'Forgot password', title: 'Create a new password', render: v => gSolo(GL.stack(auTop('Back to sign in', 'go-signin'),
  GL.head('Create a new password', `For ${ae(auMaskEmail(v.email))}`, 'Forgot password'),
  A.pwPair(v, {history: true}),
  A.btn('Save new password', {act: 'save-newpw', dis: !A.pwReady(v), why: 'Meet every password rule and confirm the new password to continue.'}),
  `<p class="au-cap">Saving your new password signs you out of AtlasIQ on all other devices, and unlocks your account if it was locked.</p>`), 'Forgot password')});
auDef('g-linkexp', {t: 'G', group: 'Forgot password', title: 'Reset link expired', render: v => gSolo(GL.stack(auTop('Back to sign in', 'go-signin'), A.tile('clock', 'warn'),
  GL.head('This reset link has expired', `For your security, reset links can be used once and expire after ${R_.linkMin} minutes. Request a new link and use it right away.`),
  A.btn('Send a new link', {act: 'send-reset', icon: 'mail'}), `<p class="au-cap">We'll send it to ${ae(auMaskEmail(v.email))}.</p>`), 'Forgot password')});

/* ---------- provider registration: six numbered steps ---------- */
const gReady = () => `<div class="k-ready au-ready"><b>Have these ready</b><ul>${['Your agency\'s NPI and tax ID (FEIN)', 'Your agency\'s phone number, and fax number if you have one', 'An email address you can open now', 'A smartphone with an authenticator app, such as Microsoft Authenticator or Google Authenticator', 'Proof of role for each authorized representative (up to 2)'].map(t => `<li>${ic('check', 16)}<span>${t}</span></li>`).join('')}</ul></div>`;
auDef('g-r1', {t: 'G', group: 'Register', title: '1 · Your agency', render: v => {
  const e = v.err || {};
  let note = '';
  if (v.match === 'suggest') note = `<div class="ai-note ai-match au-ai"><span class="ai-tag">${ic('sparkle', 14)}Suggested by Stella</span><p class="ai-tx">This NPI is enrolled as <b>Riverbend Home Health LLC</b>, Durham, NC. Using the enrolled name helps CQH confirm your agency faster.</p><div class="au-row">${A.btn('Use the enrolled name', {kind: 's', act: 'use-name', block: false, sm: true})}${A.link('Keep my entry', 'keep-name')}</div><p class="ai-src">${ic('info', 14)}<span>From the public NPI registry. Nothing changes until you choose.</span></p></div>`;
  const top = v.match === 'nomatch' ? A.alert('err', 'We couldn\'t match these details to an enrollment record', 'Please check the NPI and tax ID against your NC Medicaid enrollment. If they\'re correct, contact support and we\'ll help you register.', A.link('Contact support', 'support'))
    : v.match === 'taken' ? A.alert('warn', 'This agency is already registered', 'Someone at Riverbend Home Health already has an AtlasIQ account. Ask them to add you as a user, or sign in if the account is yours.', A.link('Sign in', 'go-signin')) : '';
  const ready = String(v.agency || '').trim() && auDig(v.npi).length === 10 && auDig(v.tax).length === 9 && auDig(v.aphone).length === 10;
  return GL.reg(1, GL.stack(GL.head('Tell us about your agency', 'We match your NPI and tax ID to your NC Medicaid enrollment record to confirm your agency.'), top,
    A.field({name: 'agency', label: 'Agency name', req: true, val: v.agency, ph: 'Enter your agency\'s name', ac: 'organization', err: e.agency}),
    A.field({name: 'npi', label: 'Agency NPI', req: true, tip: 'The National Provider Identifier: the 10-digit number on your NC Medicaid enrollment record.', tipOpen: v.tip === 'npi', val: v.npi, ph: '10 digits', mono: true, im: 'numeric', max: 10, hint: 'The 10-digit number on your enrollment record.', err: e.npi, w: 'm'}),

  if (v.err === true && key === 'saved') v.err = false;

  ['3.14.8', 'AI assistance, people decide', 'Only where it helps: Stella suggests the enrolled agency name, checks that proof of role is readable, suggests what to send when a representative isn\'t accepted, finds a supervisor for staff not yet set up or without a program, preselects the program that needs attention and briefs admins on what needs them. Every suggestion names its source, and nothing changes until a person chooses.', codesOf(['g-r1.default', 'g-r6.adding', 'g-home.action', 'g-reps.upload', 'd-program', 'd-ssoerr.noaccess', 'd-staff', 'd-adduser', 'd-pacc', 'd-user.locked', 'd-verify', 'd-rules'])],
  ['WCAG 2.1 AA', 'Forms and buttons', 'Required fields are marked * with a note at the top of each form. Main buttons stay disabled until the form is complete, with the reason shown under the button. Every disabled button, field, checkbox and tooltip meets contrast and keyboard requirements.', 'All forms'],
  ['Session', 'Session timeout', `Warning ${AUD.rules.warnMin} minutes before sign-out after ${AUD.rules.idleMin} idle minutes, then a signed-out page. Manual sign-out.`, codesOf(['g-timeout', 'g-out', 'd-timeout', 'd-out'])]
];
const DECIDE = [
  ['Two sign-in pages', 'SRS 3.1.1 says all users sign in at the same place. As agreed, providers, customers and partners use a Guided page and CQH staff use a Copilot page. Each page recognizes the other kind of address and sends the person to the right page. Please confirm with CQH.'],
  ['How customers and partners sign in (Q‑010)', 'Designed with an AtlasIQ password and two-step verification. Their organization\'s own sign-in is shown as an option that stays off until Q-010 is decided.'],
  ['CQH\'s identity provider (INT-13, 6.1.4)', 'Shown as Microsoft Entra ID. CQH staff are recognized by their @cqh.org address.'],
  ['Sign-in rule values', `Placeholders until CQH security confirms: ${AUD.rules.len}-character passwords, change every ${AUD.rules.expiry} days, last ${AUD.rules.history} not reused, temporary lock after ${AUD.rules.attempts} incorrect attempts for ${AUD.rules.lockMin} minutes, reset links ${AUD.rules.linkMin} minutes, codes ${AUD.rules.codeMin} minutes, sign-out after ${AUD.rules.idleMin} idle minutes. NIST SP 800-63B advises against scheduled password changes; the rules page offers the choice.`],
  ['Two-step verification methods (as decided)', 'Everyone sets up an authenticator app: during registration step 5 for providers, and step 2 of the invitation for customers and partners. At sign-in, Try another way offers the authenticator app, a one-time code by email, or a recovery code. Text messages aren\'t used, because a phone may not be at hand. An email code is only as secure as the email account, so CQH security should confirm it as a backup.'],
  ['Number of representatives (D-14)', `Two by default, as the SRS says, or as set in the customer's contract.`],
  ['Program choice after staff sign-in', 'Staff in more than one program choose where to work, with Stella preselecting the one that needs them. Staff in one program go straight to it. Staff with no program see who can add them.'],
  ['Provider fax numbers (CAS-171, CAS-176)', 'The agency\'s fax number and each representative\'s fax number are optional, because Milestone 2 letters are delivered through the portal.']
];
function viewScope() {
  return `<div class="ls-in ls-pad"><h1 class="ls-h1">Scope coverage</h1><p class="ls-lede">Each sign-in and access requirement from the SRS and the Final Scope sheet, and the screens that cover it. Codes match All screens and the Figma file.</p>` +
    `<div class="ls-tw"><table class="ls-tbl"><thead><tr><th>Ref</th><th>Requirement</th><th>How the screens cover it</th><th>Screens</th></tr></thead><tbody>${COVER.map(([r, t, d, s]) => `<tr><td><code>${r}</code></td><td><b>${t}</b></td><td>${d}</td><td class="ls-nw">${s}</td></tr>`).join('')}</tbody></table></div>` +
    `<h2 class="ls-h2">Decisions to confirm</h2><div class="ls-dec">${DECIDE.map(([t, d], i) => `<section class="ls-card"><div class="ls-ch"><span class="ls-num">${i + 1}</span><h2>${t}</h2></div><p class="ls-p">${d}</p></section>`).join('')}</div>` +
    `<p class="ls-note">All people, agencies and numbers are synthetic sample data.</p></div>`;
}
function boxHtml() {
  const i = GUIDE_ORDER.findIndex(x => x.key === UI.box), x = GUIDE_ORDER[i];
  if (!x) return '';
  return `<div class="ls-box" role="dialog" aria-modal="true" aria-label="${esc2(x.code + ' ' + x.name)}"><div class="ls-boxbar"><code>${x.code}</code><b>${x.name}</b><span class="ls-mute">${SEC_NAME[x.sec]} · ${GUIDE_FLOW[x.key]}</span><span class="ls-grow"></span><button type="button" class="ls-btn" data-ui="boxstep" data-v="-1" ${i ? '' : 'disabled'} aria-label="Previous state">‹</button><button type="button" class="ls-btn" data-ui="boxstep" data-v="1" ${i < GUIDE_ORDER.length - 1 ? '' : 'disabled'} aria-label="Next state">›</button><button type="button" class="ls-btn pri" data-ui="trylive" data-v="${x.key}">Try it live</button><button type="button" class="ls-btn" data-ui="boxclose" aria-label="Close">Close</button></div><div class="ls-boxs"><div class="ls-stage" id="ls-boxst"><div class="ls-sc">${auStatic(x, isDark() ? 'dark' : 'light')}</div></div></div></div>`;
}

/* ---------- drawing ---------- */
let LSIO = null;
function draw() {
  document.documentElement.dataset.theme = isDark() ? 'dark' : 'light';
  const root = document.getElementById('app');
  root.innerHTML = topBar() + `<main>${UI.view === 'live' ? viewLive() : UI.view === 'screens' ? viewScreens() : viewScope()}</main>` + (UI.box ? boxHtml() : '');
  if (UI.view === 'live') { drawLive(true); drawSide(); }
  if (UI.view === 'screens') thumbs();
  if (UI.box) { const b = $('#ls-boxst'); scaleBox(b); }
  saveUI();
}
function thumbs() {
  if (LSIO) LSIO.disconnect();
  const fill = el => { if (el.dataset.done === (isDark() ? 'd' : 'l')) return; const x = AU_ALL.find(y => y.key === el.dataset.thumb); el.firstElementChild.innerHTML = auStatic(x, isDark() ? 'dark' : 'light'); el.dataset.done = isDark() ? 'd' : 'l'; const k = el.clientWidth / 1440; el.firstElementChild.style.transform = `scale(${k})`; };
  const els = document.querySelectorAll('[data-thumb]');
  if ('IntersectionObserver' in window) { LSIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) fill(e.target); }), {rootMargin: '400px'}); els.forEach(e => LSIO.observe(e)); } else els.forEach(fill);
}
function drawLive(scrollTop) {
  const f = $('#ls-frame'); if (!f) return;
  const a = document.activeElement, fid = a && f.contains(a) ? a.id : null, sel = fid && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  f.innerHTML = liveHtml();
  scaleBox($('#ls-stage'));
  const url = $('#ls-url'); if (url) url.innerHTML = `${ic('lock', 14)}<span>${LIVE.id === 'd-idp' ? '' : 'atlasiq.cqh.org/'}${PATH[LIVE.id] || ''}</span>`;
  const th = $('#ls-theme'), t = auTheme(LIVE.id); if (th) { th.className = 'ls-theme ' + (t === 'G' ? 'g' : 'd'); th.innerHTML = `<i></i>${THEME_OF[t].name} · ${THEME_OF[t].who}`; }
  if (fid) { const n = document.getElementById(fid); if (n) { n.focus({preventScroll: true}); if (sel && n.setSelectionRange) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  else if (scrollTop) { const st = $('#ls-stage'); const r = st.getBoundingClientRect(); if (r.top < 0) window.scrollBy(0, r.top - 80); const first = f.querySelector('.au-ctl:not([type=checkbox]):not([type=radio]), .au-otp-in'); if (first && window.innerWidth > 900) first.focus({preventScroll: true}); }
}
function drawSide() {
  const g = $('#ls-guide'); if (!g) return;
  g.innerHTML = guideHtml(); $('#ls-ctl').innerHTML = ctlHtml(); $('#ls-app').innerHTML = appHtml(); $('#ls-feed').innerHTML = feedHtml();
  $('#ls-n').textContent = LIVE.inbox.length ? LIVE.inbox.length + (LIVE.inbox.length === 1 ? ' message' : ' messages') : '';
  LIVE.inbox.forEach(m => { m.fresh = false; });
}
LIVE.onChange = (nav) => { if (UI.view !== 'live') return; drawLive(nav); drawSide(); };
LIVE.toast = t => { const e = document.createElement('div'); e.className = 'ls-toast'; e.setAttribute('role', 'status'); e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3200); };

/* a state opened from All screens gets what it needs to keep going (a code to type, who is signing in) */
function auPrime() {
  const id = LIVE.id, v = LIVE.v;
  if (['g-code', 'g-another', 'g-recovery', 'g-expired'].includes(id)) { LIVE.who = ACCTS['denise.roy@sunrisehomecare.com']; LIVE.dest = 'x-pv'; v.p = v.p || AUD.denise; }
  if (/^g-(r[1-7]|r5c|home|larea|reps)$/.test(id) && !LIVE.reg) { const r = auReg(); Object.assign(r, {agency: 'Riverbend Home Health', npi: AUD.maya.npi, tax: AUD.maya.tax, first: 'Maya', last: 'Patel', job: 'Owner', wemail: AUD.maya.email, phone: AUD.maya.phone, pw: 'Riverbend#Care26', reps: (v.reps || []).slice(), done: /home|larea|reps|r7/.test(id)}); }
  if (id === 'g-code') { if (v.method === 'email') auMailCode(AUD.denise.email, 'sign-in'); else auAppCode(); v.code = ''; v.err = ''; }
  if (id === 'g-r3') { auMailCode(v.wemail); v.code = ''; v.err = ''; }
  if (id === 'g-r5' || id === 'g-imfa') { auAppCode(); v.code = ''; v.err = ''; }
  if (id === 'g-r3') { v.err = ''; }
  if (/^g-(home|reps)$/.test(id)) LIVE.verify = v.state === 'upload' ? 'action' : v.state || 'review';
  if (id === 'g-larea') LIVE.verify = 'review';
  if (id === 'g-reps' && v.state === 'upload') v.file = '';
  if (/^(g-timeout|d-timeout)$/.test(id)) { v.back = id === 'g-timeout' ? 'x-pv' : 'x-rv'; }
}
/* ---------- events ---------- */
function startScen(k) { const s = SCEN.find(x => x[1] === k); if (!s) return; UI.scen = k; LIVE.app = ''; LIVE.inbox = []; LIVE.expect = ''; LIVE.flags = {}; s[4](); if (UI.view !== 'live') { UI.view = 'live'; draw(); } else drawSide(); }
document.addEventListener('click', ev => {
  const u = ev.target.closest('[data-ui]');
  if (u) {
    const v = u.dataset.v;
    switch (u.dataset.ui) {
      case 'view': UI.view = v; UI.box = null; draw(); window.scrollTo(0, 0); return;
      case 'mode': UI.mode = v; draw(); return;
      case 'sec': UI.sec = v; draw(); return;
      case 'scen': startScen(v); document.querySelectorAll('.ls-sc-b').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); return;
      case 'restart': if (UI.scen) startScen(UI.scen); else { auGo('g-signin', {}); } return;
      case 'fill': { const [e, pw] = v.split('|'); if (/^d-signin$/.test(LIVE.id)) { LIVE.v.email = e; LIVE.v.err = ''; LIVE.v.msg = ''; } else if (LIVE.id === 'g-signin') { LIVE.v.email = e; LIVE.v.pw = pw; LIVE.v.err = {}; } else if (LIVE.id === 'g-forgot') { LIVE.v.email = e; LIVE.v.err = ''; } else { LIVE.toast('Open the sign-in page first'); return; } auRender(); return; }
      case 'usecode': {
        const inp = document.querySelector('#ls-frame .au-otp-in');
        if (!inp) { LIVE.toast('There\'s no code box on this screen'); return; }
        LIVE.v.code = v; LIVE.v.err = ''; auRender(); return;
      }
      case 'mail': { const [a, arg] = v.split('|'); ACT[a](arg); return; }
      case 'idle': { const [back, bg] = v.split('|'); auGo(/^d-/.test(back) || back === 'x-rv' ? 'd-timeout' : 'g-timeout', {sec: 120, bg, back, backV: clone(LIVE.v)}); return; }
      case 'signout': auGo(auTheme(LIVE.id) === 'D' ? 'd-out' : 'g-out', {reason: 'manual'}); return;
      case 'decide': LIVE.verify = v; auSend({kind: 'email', to: auReg().wemail || AUD.maya.email, from: 'AtlasIQ <no-reply@atlasiq.cqh.org>', title: v === 'verified' ? 'Your agency is fully verified' : 'Action needed: send new proof of role', body: v === 'verified' ? 'Claim status, Upload records, Letters and Chat assistant are now unlocked. Sign in to AtlasIQ to get started.' : 'CQH couldn\'t verify Maya Patel because the proof of role was unreadable. Sign in to send a clear copy, or name a different representative.'}); auGo(LIVE.id === 'g-reps' ? 'g-reps' : 'g-home', {state: v}); return;
      case 'open': UI.box = v; $('#app').insertAdjacentHTML('beforeend', boxHtml()); scaleBox($('#ls-boxst')); const cb = document.querySelector('.ls-box [data-ui=boxclose]'); if (cb) cb.focus(); return;
      case 'boxstep': { const i = GUIDE_ORDER.findIndex(x => x.key === UI.box) + +v; if (GUIDE_ORDER[i]) { UI.box = GUIDE_ORDER[i].key; const b = document.querySelector('.ls-box'); b.outerHTML = boxHtml(); scaleBox($('#ls-boxst')); } return; }
      case 'boxclose': UI.box = null; document.querySelector('.ls-box').remove(); return;
      case 'trylive': UI.box = null; UI.scen = null; UI.view = 'live'; LIVE.app = ''; if (/^d-(staff|adduser|user|pacc|cp|invite|rules)/.test(v)) LIVE.who = STAFF_IDP['ray.whitfield@cqh.org']; if (/^d-verify/.test(v)) LIVE.who = STAFF_IDP['priya.shah@cqh.org']; auGo(v); auPrime(); draw(); window.scrollTo(0, 0); return;
    }
    return;
  }
  const fr = ev.target.closest('#ls-frame');
  if (!fr) return;
  const a = ev.target.closest('[data-act]');
  if (a && a.closest('#ls-frame')) {
    if (a.tagName === 'A' || a.tagName === 'BUTTON') ev.preventDefault();
    if (a.disabled) return;
    const k = a.dataset.act;
    if (ACT[k]) ACT[k](a.dataset.arg, a); else if (k) LIVE.toast('This action is outside sign-in and access in this preview.');
    return;
  }
  /* links and menus inside the admin pages */
  const nav = ev.target.closest('.k-ni, .k-crumb a, .k-tbl a, .au-pn a');
  if (nav && auTheme(LIVE.id) === 'D' && /^d-/.test(LIVE.id)) { ev.preventDefault(); const t = nav.textContent.trim(); const to = Object.keys(NAV_D).find(k => t === k || t.startsWith(k)); if (to) auGo(NAV_D[to]); else LIVE.toast('This page is outside sign-in and access.'); return; }
  const lnk = ev.target.closest('a[href="#"], .k-ni, button');
  if (lnk && !ev.target.closest('label')) { ev.preventDefault(); if (/^x-/.test(LIVE.id)) LIVE.toast('You\'re signed in. Use Session on the right to test the timeout or sign out.'); }
});
document.addEventListener('input', ev => { const el = ev.target; if (!el.closest || !el.closest('#ls-frame') || !el.dataset.bind) return; auBind(el); auRender(); });
document.addEventListener('change', ev => { const el = ev.target; if (!el.closest || !el.closest('#ls-frame') || !el.dataset.bind) return; if (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') { auBind(el); auRender(); } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && ev.target.closest && ev.target.closest('.au-tipw')) { ev.target.blur(); return; }
  if (ev.key === 'Escape' && UI.box) { UI.box = null; const b = document.querySelector('.ls-box'); if (b) b.remove(); return; }
  if (UI.box && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { const b = document.querySelector(`[data-ui=boxstep][data-v="${ev.key === 'ArrowRight' ? 1 : -1}"]`); if (b && !b.disabled) b.click(); return; }
  if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('#ls-frame') && ev.target.matches('input:not([type=checkbox]):not([type=radio])')) {
    ev.preventDefault();
    const f = $('#ls-frame'), scope = ev.target.closest('.au-addrep') || f;
    const b = scope.querySelector('.au-addrep .k-btn') && scope.classList.contains('au-addrep') ? scope.querySelector('.k-btn') : f.querySelector('.au-mod .k-btn.p') || [...f.querySelectorAll('.k-btn.p.block, .k-btn.p')].find(x => !x.closest('.au-scrim') && !x.disabled);
    if (b) b.click();
  }
});
window.addEventListener('resize', () => { if (UI.view === 'live') scaleBox($('#ls-stage')); if (UI.box) scaleBox($('#ls-boxst')); if (UI.view === 'screens') document.querySelectorAll('[data-thumb]').forEach(el => { if (el.firstElementChild.firstElementChild) el.firstElementChild.style.transform = `scale(${el.clientWidth / 1440})`; }); });
if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (UI.mode === 'system') draw(); });
/* one tick a second: resend countdowns and the session warning */
setInterval(() => {
  if (UI.view !== 'live') return;
  const v = LIVE.v;
  if (/^(g-timeout|d-timeout)$/.test(LIVE.id)) {
    v.sec = (v.sec == null ? 120 : v.sec) - 1;
    if (v.sec <= 0) return auGo(LIVE.id === 'g-timeout' ? 'g-out' : 'd-out', {reason: 'timeout'});
    const cd = document.getElementById('au-cd'); if (cd) cd.textContent = auMMSS(v.sec);
    return;
  }
  if (v.resend > 0) {
    v.resend -= 1;
    if (v.resend === 0) return auRender();
    const b = document.querySelector('#ls-frame .au-tb[disabled] span'); if (b) b.textContent = b.textContent.replace(/0:\d\d$/, '0:' + String(v.resend).padStart(2, '0'));
  }
}, 1000);
/* used for the Figma export and the checks */
window.__au = (key, mode) => { const x = AU_ALL.find(y => y.key === key); const f = document.getElementById('frame'); f.innerHTML = auStatic(x, mode); return x.code; };
auGo('g-signin', {});
draw();

</script>
