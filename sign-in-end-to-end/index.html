<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AtlasIQ Sign-in and Access Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>/* Layout: a sticky top bar with the guide's views; each view is a centered column (max 1180px).
   The journey view adds a sticky stage rail on the left. Colors follow AtlasIQ's Copilot tokens, with one
   color per role used only beside a text label. */
:root{
  --bg:#f6f6fb;--surface:#ffffff;--inset:#f0f1f8;--line:#dfe2ee;--line-strong:#b9bfd3;
  --fg:#161a2e;--muted:#4a5068;--accent:#4338ca;--accent-ink:#ffffff;--link:#3b30b8;--focus:#4338ca;
  --main:#14613f;--main-tint:#e5f3ea;--alt:#8a4b00;--alt-tint:#fbf1e1;--exc:#a3272f;--exc-tint:#fbe9ea;--gap:#4a5068;--gap-tint:#eef0f5;
  --r-nct:#8a4b00;--t-nct:#fbf1e1;--r-sys:#3f4a5e;--t-sys:#eceef4;--r-sv:#4338ca;--t-sv:#ecebfd;--r-ix:#1f5f8b;--t-ix:#e6f0f8;
  --r-pv:#0b6e66;--t-pv:#e3f2ef;--r-rv:#7a2e6e;--t-rv:#f6e9f3;--r-qa:#14613f;--t-qa:#e5f3ea;--r-su:#4a5068;--t-su:#eef0f5;
  --band:#eef0f7;--shadow:0 1px 2px rgba(22,26,46,.06),0 4px 14px rgba(22,26,46,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b2130;--surface:#242c3d;--inset:#2b3447;--line:#364158;--line-strong:#56627f;
  --fg:#e6edf7;--muted:#b3bfd1;--accent:#4338ca;--accent-ink:#ffffff;--link:#b4b0ff;--focus:#b4b0ff;
  --main:#5ff0ae;--main-tint:#1e3a2e;--alt:#f5c56e;--alt-tint:#3a3122;--exc:#ffab91;--exc-tint:#43262a;--gap:#c3cde0;--gap-tint:#2f3747;
  --r-nct:#f5c56e;--t-nct:#3a3122;--r-sys:#c3cde0;--t-sys:#2f3747;--r-sv:#b4b0ff;--t-sv:#2f2c5e;--r-ix:#8cc4ee;--t-ix:#1f3446;
  --r-pv:#7fe3d6;--t-pv:#1d3a38;--r-rv:#e6a3d8;--t-rv:#3a2638;--r-qa:#5ff0ae;--t-qa:#1e3a2e;--r-su:#c3cde0;--t-su:#2f3747;
  --band:#212839;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b2130;--surface:#242c3d;--inset:#2b3447;--line:#364158;--line-strong:#56627f;
  --fg:#e6edf7;--muted:#b3bfd1;--accent:#4338ca;--accent-ink:#ffffff;--link:#b4b0ff;--focus:#b4b0ff;
  --main:#5ff0ae;--main-tint:#1e3a2e;--alt:#f5c56e;--alt-tint:#3a3122;--exc:#ffab91;--exc-tint:#43262a;--gap:#c3cde0;--gap-tint:#2f3747;
  --r-nct:#f5c56e;--t-nct:#3a3122;--r-sys:#c3cde0;--t-sys:#2f3747;--r-sv:#b4b0ff;--t-sv:#2f2c5e;--r-ix:#8cc4ee;--t-ix:#1f3446;
  --r-pv:#7fe3d6;--t-pv:#1d3a38;--r-rv:#e6a3d8;--t-rv:#3a2638;--r-qa:#5ff0ae;--t-qa:#1e3a2e;--r-su:#c3cde0;--t-su:#2f3747;
  --band:#212839;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.mono,code{font-family:var(--mono);font-size:.9em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:var(--fg)}
.brand-mk{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand b{font-weight:600;font-size:15px;display:block;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;padding:8px 12px;border-radius:8px;white-space:nowrap}
.tabs a:hover{background:var(--inset);color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--t-sv);color:var(--r-sv)}
.theme-btn{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--fg)}
.theme-btn:hover{background:var(--inset)}

/* page */
main{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.view{display:grid;gap:36px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.01em}
.h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.25}
.h3{font-size:17px;font-weight:600;line-height:1.35}
.lede{font-size:18px;color:var(--muted);max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec-head{display:grid;gap:6px;max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:20px 22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 14px;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;border:1px solid transparent;line-height:1.2}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sec{background:var(--surface);border-color:var(--line-strong);color:var(--fg)}
.btn.sec:hover{background:var(--inset)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* role chip */
.role{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:3px 9px 3px 7px;border-radius:999px;background:var(--rt);color:var(--fg);border:1px solid color-mix(in srgb,var(--rc) 35%,transparent);white-space:nowrap}
.role i{width:9px;height:9px;border-radius:50%;background:var(--rc);flex:none}
.role.nct{--rc:var(--r-nct);--rt:var(--t-nct)}.role.sys{--rc:var(--r-sys);--rt:var(--t-sys)}.role.sv{--rc:var(--r-sv);--rt:var(--t-sv)}.role.ix{--rc:var(--r-ix);--rt:var(--t-ix)}
.role.pv{--rc:var(--r-pv);--rt:var(--t-pv)}.role.rv{--rc:var(--r-rv);--rt:var(--t-rv)}.role.qa{--rc:var(--r-qa);--rt:var(--t-qa)}.role.su{--rc:var(--r-su);--rt:var(--t-su)}

/* path tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;letter-spacing:.01em}
.tag svg{flex:none}
.tag.main{background:var(--main-tint);color:var(--main)}
.tag.alt{background:var(--alt-tint);color:var(--alt)}
.tag.exc{background:var(--exc-tint);color:var(--exc)}
.tag.gap,.tag.scope{background:var(--gap-tint);color:var(--gap);border:1px dashed var(--gap)}
.tag.confirm{background:var(--alt-tint);color:var(--alt)}
.tag.differs{background:var(--exc-tint);color:var(--exc)}
.srs{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--inset);border-radius:5px;padding:1px 6px}

/* screen chip */
.scr{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:4px 10px 4px 4px;cursor:pointer;text-align:left;max-width:100%}
.scr:hover{border-color:var(--accent);background:var(--inset)}
.scr img{width:46px;height:30px;object-fit:cover;object-position:top left;border-radius:5px;border:1px solid var(--line);flex:none;background:var(--inset)}
.scr code{font-weight:500;color:var(--fg)}
.scr span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.scr.g code{color:var(--r-pv)}
.scrs{display:flex;flex-wrap:wrap;gap:8px}

/* overview */
.hero{display:grid;gap:14px;max-width:880px}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:4px}
.fact b{font-family:var(--serif);font-size:28px;font-weight:600;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-size:14px;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.howto a{display:grid;gap:4px;text-decoration:none;color:var(--fg);padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.howto a:hover{border-color:var(--accent)}
.howto a b{font-weight:600}
.howto a span{font-size:14px;color:var(--muted)}
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.map{display:block;min-width:1060px;width:100%;height:auto}
.map text{fill:var(--fg);font-family:var(--sans)}
.map .lane-h{font-size:12.5px;font-weight:600}
.map .lane-k{font-size:11px;fill:var(--muted)}
.map .band-n{font-family:var(--serif);font-size:20px;font-weight:600;fill:var(--muted)}
.map .band-t{font-size:12.5px;font-weight:600}
.map .node rect{stroke-width:1.5}
.map .node text{font-size:12px}
.map .node:hover rect,.map .node:focus-visible rect{stroke-width:3}
.map .node:focus{outline:none}
.map .node:focus-visible rect{stroke:var(--focus)}
.map .edge{fill:none;stroke:var(--line-strong);stroke-width:1.6}
.map .edge.main{stroke:var(--muted)}
.map .edge.loop{stroke-dasharray:5 4}
.map .badge circle{fill:var(--surface);stroke:var(--fg);stroke-width:1.4}
.map .badge text{font-size:11px;font-weight:700;text-anchor:middle}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 24px;padding:16px 20px;border-top:1px solid var(--line)}
.legend li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.legend ol{list-style:none;margin:0;padding:0;display:contents}
.lgb{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font-size:11px;font-weight:700}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.stage-c{display:grid;gap:10px;align-content:start;padding:18px 20px;text-decoration:none;color:var(--fg);border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stage-c:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.stage-c .sn{font-family:var(--serif);font-size:15px;color:var(--muted);font-weight:600}
.stage-c h3{font-size:18px;font-weight:600}
.stage-c p{font-size:14px;color:var(--muted)}
.clock{display:grid;gap:0;counter-reset:c;margin:0;padding:0;list-style:none}
.clock li{display:grid;grid-template-columns:160px 22px 1fr;gap:14px;align-items:start;position:relative;padding-bottom:16px}
.clock li::after{content:"";position:absolute;left:calc(160px + 14px + 10px);top:22px;bottom:0;width:2px;background:var(--line)}
.clock li:last-child::after{display:none}
.clock .d{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.clock .dot{width:22px;height:22px;border-radius:50%;background:var(--rt);border:2px solid var(--rc);margin-top:1px}
.clock .w b{display:block;font-weight:600}
.clock .w span{font-size:14px;color:var(--muted)}
.status{counter-reset:s;display:grid;gap:10px;list-style:none;margin:0;padding:0}
.status li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.status .sn{width:30px;height:30px;border-radius:8px;background:var(--inset);display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.status b{font-weight:600}
.status .st-b{display:grid;gap:6px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.support{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.support li{list-style:none;display:grid;gap:8px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.support ul{margin:0;padding:0;display:contents}
.support p{font-size:14px}

/* journey */
.journey{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:2px}
.rail a{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-decoration:none;color:var(--muted);font-size:14px;padding:8px 10px;border-radius:9px;line-height:1.3}
.rail a b{font-family:var(--serif);font-weight:600}
.rail a:hover{background:var(--surface);color:var(--fg)}
.rail a[aria-current="step"]{background:var(--surface);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.rail .rh{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
.st-head{display:grid;gap:14px}
.st-num{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--muted)}
.st-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.st-meta div{background:var(--surface);padding:12px 14px;display:grid;gap:4px;align-content:start}
.st-meta dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st-meta dd{margin:0;font-size:14px}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:0}
.fi{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;position:relative;padding-bottom:18px;scroll-margin-top:96px}
.fi::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line-strong)}
.fi:last-child::before{display:none}
.fi .mk{width:44px;height:44px;display:grid;place-items:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;border-radius:12px;background:var(--surface);border:1.5px solid var(--line-strong);position:relative;z-index:1}
.fi.dec .mk{border:none;background:none}
.fi.dec .mk svg{position:absolute;inset:0}
.fi.dec .mk span{position:relative;font-size:12px}
.fi.always .mk{border-style:dashed}
.fi-b{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.fi.hl .fi-b{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fi-t{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.fi-t h3{font-size:17px;font-weight:600;flex:1 1 280px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:15px}
.kv dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;min-width:0}
.go{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px}
.go svg{flex:none}
.outs{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.out{display:grid;gap:8px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--inset);border-left:4px solid var(--oc)}
.out.main{--oc:var(--main)}.out.alt{--oc:var(--alt)}.out.exc{--oc:var(--exc)}.out.gap{--oc:var(--gap);border-left-style:dashed}
.out-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.out-h b{font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:10px}
.note svg{flex:none;margin-top:2px}
.note.confirm{background:var(--alt-tint);color:var(--fg)}
.note.confirm svg{color:var(--alt)}
.note.gap{background:var(--gap-tint);border:1px dashed var(--gap)}
.note a{font-weight:500}
.side-h{margin-top:8px}
.sides{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.side{display:grid;gap:8px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--oc);scroll-margin-top:96px}
.side.exc{--oc:var(--exc)}.side.gap{--oc:var(--gap);border-left-style:dashed}
.st-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px}

/* exceptions */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--t-sv);border-color:var(--r-sv);color:var(--fg)}
.chip em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.xgroup{display:grid;gap:10px}
.xgroup h3{font-family:var(--serif);font-size:19px;font-weight:600}
.xc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,.9fr);gap:16px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--oc)}
.xc.exc{--oc:var(--exc)}.xc.alt{--oc:var(--alt)}.xc.gap{--oc:var(--gap);border-left-style:dashed}
.xc>div{display:grid;gap:6px;align-content:start;min-width:0}
.xc .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* roles */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.role-c{display:grid;gap:12px;align-content:start;padding:18px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--rc)}
.role-c.nct{--rc:var(--r-nct)}.role-c.sys{--rc:var(--r-sys)}.role-c.sv{--rc:var(--r-sv)}.role-c.ix{--rc:var(--r-ix)}.role-c.pv{--rc:var(--r-pv)}.role-c.rv{--rc:var(--r-rv)}.role-c.qa{--rc:var(--r-qa)}.role-c.su{--rc:var(--r-su)}
.role-c ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}

/* screens */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.fld{display:grid;gap:4px}

.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}

const SRS = {"3.1.1":{"t":"Sign-in and credential handling","x":"All users sign in at the same place. Internal users sign in through the organisation's identity provider and complete MFA. Providers sign in with provider credentials held in the platform and also complete a second factor. The credential decides which workspace opens.","a":"Internal User; Provider","src":"PRO-036, CAS-009, CAS-029, NFR-002, NFR-004"},"3.1.2":{"t":"Password and account recovery","x":"Users can reset passwords, recover access and handle lockouts, while administrators enforce password rules (including complexity and how often passwords must change), unlock accounts and reset them when required.","a":"Internal User; Supervisor; Superuser","src":"CAS-033"},"3.1.3":{"t":"Internal user access setup","x":"Supervisors or superusers create workforce accounts and assign access by role, customer, programme, function and allowed actions such as view, upload or download. Provider accounts are self-registered, but supervisors and superusers can suspend, restore or close a provider's access.","a":"Superuser; Supervisor","src":"DOC-003, PRO-074, CAS-115, CAS-121, NFR-003"},"3.1.4":{"t":"Provider self-registration and restricted access","x":"Providers register themselves in the same application, verify their identity, and can recover their own access. Once signed in they land in the provider workspace and see only their own information. Anonymous or unverified users get only limited functions.","a":"Provider","src":"PRO-072, NFR-005"},"3.1.5":{"t":"Authorised-agent verification","x":"Enforcement only: protected provider screens and chatbot functions stay blocked until the provider's authorised-agent record is verified. The agent record, limits and history are set up under Provider – Verify authorised representatives.","a":"Authorized Agent","src":"PRO-014, CAS-175"},"3.1.6":{"t":"Login and activity audit","x":"The platform records login status with dates and times, and every important access, change, decision, assignment and export with the responsible user, timestamp and source IP address.","a":"System","src":"DOC-047, PRO-066, CAS-129, CAS-248, CAS-252, NFR-006"},"3.1.7":{"t":"Security and compliance baseline","x":"All platform data, files, backups and logs are encrypted and handled under HIPAA-compliant security controls. The source requirements also call for SOC 2 and HITRUST; whether formal certification or alignment is required is to be confirmed (Decision D-04, Q-011).","a":"System","src":"PRO-065, NFR-001, NFR-007, NFR-008"},"3.1.9":{"t":"Customer and external-partner access","x":"Customer users (for example state programme staff) and authorised external partners (for example the Attorney General's office, licensure boards and Medicaid Investigations Division units) are given accounts by a superuser or supervisor, complete MFA and can reach only the dashboards, reports, correspondence and case information released to them for their own programme. Access limits distinguish viewing, downloading and uploading, and every access is logged. Whether these users sign in through their own organisation's identity provider or with platform-held credentials is to be confirmed (Q-010).","a":"Superuser; Supervisor; Customer; External Partner","src":"CAS-060 to CAS-062, CAS-276, NFR-002, NFR-003"},"3.2.1":{"t":"Role-based home workspace","x":"After login, each user lands on a role-based home page (\"Pod Central\") showing work in progress, work available to pull from the main queue, anticipated due dates, letters to be sent, alerts, messages, announcements, updates on system changes and resource links; supervisors and managers also see graphs and management summaries, and superusers can maintain home-page content.","a":"Internal User; Supervisor; Superuser","src":"CAS-019, CAS-021, CAS-041"},"3.2.4":{"t":"Help and reference resources","x":"Every area provides help prompts, including hover tooltips. A reference library - organised by customer and work scope, plus an internal library - holds user manuals, policy and procedure manuals, clinical policies, rules and regulations, fee schedules, forms, code references, help links and training resources that stay updated with system changes. Users can attach a relevant policy or reference to any page, and a user manual is produced and kept current with every upgrade or release.","a":"Internal User","src":"DOC-068, PRO-033, CAS-012, CAS-020, CAS-024, CAS-112, CLA-100, CLA-103 to CLA-106, CLA-109"},"3.6.1":{"t":"Create provider case profile","x":"An internal user creates a provider case and records the provider name, NPI, tax ID (FEIN), addresses, locations, email, phone, fax, billing agent, billing-threshold requirements and case-specific service information. Each case receives a system-assigned case ID that is unique per case, and the case shows the customer's claims-transfer schedule.","a":"Internal User","src":"PRO-057, CAS-156, CAS-157, CAS-161, CAS-163 to CAS-173"},"3.6.3":{"t":"Verify authorised representatives","x":"The provider submits authorised-representative details before any communication about the review takes place. An authorised agent must be an owner or senior executive of the agency (for example Owner, CEO, CFO, Clinical Director, Medical Director or Office Manager) and cannot be an attorney. The system enforces the number of representatives allowed - two by default, or as set in the customer's contract (Decision D-14) - notifies staff when the details are submitted, and retains all authorised-contact history, contact information and links to outside sources such as LinkedIn.","a":"Provider; System; Internal User","src":"PRO-012 to PRO-014, PRO-057, CAS-155, CAS-174 to CAS-176"},"3.14.8":{"t":"Govern AI-assisted findings","x":"AI may extract, classify, summarise and highlight concerns with source evidence, but a qualified human makes the final decision; model, prompt and rule versions are controlled before production.","a":"Reviewer; System","src":"NFR-030, NFR-031, NFR-033"},"6.1.2":{"t":"Multi-Factor Authentication","x":"Require MFA for internal and external users.","a":"","src":"PRO-036, NFR-002"},"6.1.3":{"t":"Role-Based Access Control","x":"Provide role-, tenant-, program- and function-aware permissions, including administrator workflows to grant and revoke access.","a":"","src":"DOC-003, NFR-003"},"6.1.4":{"t":"Workforce SSO Setup","x":"Support enterprise SSO for workforce users; Microsoft Entra ID or another identity provider must be confirmed.","a":"","src":"CAS-009, CAS-029, NFR-004"},"6.1.5":{"t":"Provider Identity and Account Security","x":"Support secure provider registration, authorised-agent governance, identity verification and account recovery.","a":"","src":"NFR-005"},"D-14":{"t":"Authorised-agent limit","x":"Two agents (PRO-013, CAS-175) versus a customer-defined number (CAS-155). Working assumption: two by default, configurable per contract.","a":"CQH operations (decision)","src":""},"Q-010":{"t":"Identity","x":"Confirm workforce and provider identity providers, MFA, provisioning, authorized-agent verification, and account support.","a":"Security / Product (open question)","src":""},"3.1.8":{"t":"Technical platform operations","x":"The solution runs as modular, documented services with separate environments, monitoring, backups, restore testing, controlled deployments, rollback and agreed availability/support targets.","a":"System; IT / Support","src":"NFR-011, NFR-025, NFR-036"}};

let FLOWN = 0;
function flowSvg(title, rows) {
  const mk = 'fa' + (++FLOWN);
  const cx = 142, R = 316, RW = 420; let y = 56, o = '', con = '';
  const ink = 'var(--fg)', quiet = 'var(--muted)', edge = 'var(--line-strong)', acc = 'var(--accent)';
  rows.forEach((r, i) => {
    const h = r.dia ? 68 : (r.end ? 56 : 52), top = y, mid = y + h / 2;
    if (i) con += `<path d="M${cx} ${top - 26}V${top}" marker-end="url(#${mk})"/>`;
    const lab = r.dia ? `<text x="${cx}" y="${mid + (r.dia[1] ? -4 : 5)}" text-anchor="middle" font-size="13" fill="${ink}">${esc(r.dia[0])}</text>${r.dia[1] ? `<text x="${cx}" y="${mid + 12}" text-anchor="middle" font-size="13" fill="${ink}">${esc(r.dia[1])}</text>` : ''}` :
      `<text x="${cx}" y="${mid - 2}" text-anchor="middle" font-size="13" font-weight="600" fill="${ink}">${esc(r.t)}</text><text x="${cx}" y="${mid + 15}" text-anchor="middle" font-size="11.5" fill="${r.end ? ink : quiet}">${esc(r.s)}</text>`;
    const shape = r.dia ? `<polygon points="${cx},${top} ${cx + 104},${mid} ${cx},${top + h} ${cx - 104},${mid}" fill="var(--surface)" stroke="${edge}" stroke-width="1.25"/>` :
      `<rect x="24" y="${top}" width="236" height="${h}" rx="8" fill="${r.end ? 'var(--t-sv)' : 'var(--surface)'}" stroke="${r.end ? acc : edge}" stroke-width="${r.end ? 2 : 1.25}"/>`;
    o += r.code ? `<a href="#${r.code}" aria-label="${esc((r.t || r.dia.join(' ')) + ', open ' + r.code)}">${shape}${lab}</a>` : `<g>${shape}${lab}</g>`;
    if (r.n) {
      const ny = mid - 22, xs = r.dia ? cx + 104 : 260;
      con += `<path d="M${xs} ${mid}H${R}" marker-end="url(#${mk})"/>`;
      if (r.lab) o += `<text x="${(xs + R) / 2}" y="${mid - 8}" text-anchor="middle" font-size="11.5" fill="${quiet}">${esc(r.lab)}</text>`;
      o += `<a href="#${r.n[2]}" aria-label="${esc(r.n[0] + ', open ' + r.n[2])}"><rect x="${R}" y="${ny}" width="${RW}" height="44" rx="8" fill="var(--surface)" stroke="${edge}" stroke-width="1.25"/><text x="${R + 14}" y="${ny + 19}" font-size="13" font-weight="600" fill="${ink}">${esc(r.n[0])}</text><text x="${R + 14}" y="${ny + 35}" font-size="11.5" fill="${quiet}">${esc(r.n[1])}</text></a>`;
    }
    if (i < rows.length - 1 && r.dn) o += `<text x="${cx + 8}" y="${top + h + 17}" font-size="11.5" fill="${quiet}">${esc(r.dn)}</text>`;
    y = top + h + 26;
  });
  const H = y + 4;
  return `<svg class="flowsvg" viewBox="0 0 760 ${H}" role="group" aria-label="${esc(title)}"><defs><marker id="${mk}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="${ink}">${esc(title)}</text><g fill="none" stroke="var(--muted)" stroke-width="1.25">${con}</g>${o}</svg>`;
}

function inFilter(s) {

  <div class="ex-body"><div><div class="shot-tools"><span class="small muted">Design: ${s.w} px wide, light mode</span><button type="button" class="btn sec mini" data-zoom="${s.c}">View full size</button></div><div class="ex-shot" tabindex="0" aria-label="Design of ${s.c}, scrolls"><img src="s/${s.c}.webp" alt="Design of ${s.c}: ${esc(s.t)}, ${esc(s.n)}" width="${s.w}" height="${s.ht}"></div></div>
  <div><div class="tabs2" role="tablist" aria-label="Details">${tabs.map(([k, t]) => `<button type="button" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${TAB === k}" tabindex="${TAB === k ? 0 : -1}" data-tab="${k}">${t}</button>`).join('')}</div>
  <div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-${TAB}">${panelHtml(s)}</div></div></div>
  <p class="small muted">Tip: the left and right arrow keys move between states when the page has focus.</p></article></div>`;
}

/* ---------- scenarios ---------- */
let SI = 0, SJ = 0;
function viewScenarios() {
  const sc = SCEN[SI], [c, cap] = sc.s[SJ], s = ST[c];
  return `<div class="view" style="gap:20px"><header class="sec-head"><p class="eyebrow">Scenarios</p><h1 class="h1">Walk through a real situation</h1><p class="lede">Each scenario strings together the states someone actually sees, including the admin screens that change what they see.</p></header>
  <div class="scn"><ul class="scn-list" aria-label="Scenarios">${SCEN.map((x, i) => `<li><button type="button" data-si="${i}"${i === SI ? ' aria-current="true"' : ''}>${esc(x.t)}</button></li>`).join('')}</ul>
  <article class="ex-main" aria-labelledby="sc-t"><div class="row">${role(sc.who)}<span class="small muted">${sc.s.length} steps</span></div><h2 class="h2" id="sc-t">${esc(sc.t)}</h2>
  <div class="steps" role="group" aria-label="Steps">${sc.s.map(([cc, t], j) => `<button type="button" data-sj="${j}"${j === SJ ? ' aria-current="true"' : ''}><b>${j + 1}</b>${cc}</button>`).join('')}</div>
  <div class="statebox"><span class="eyebrow">Step ${SJ + 1}: ${c} · ${esc(s.t)}</span><p style="font-size:17px">${esc(cap)}</p><p class="small">${esc(s.n)}. ${esc((s.h || [''])[0])}</p><div class="row"><a class="btn pri mini" href="#${c}">Open ${c} in the explorer${ICON.arrow}</a></div></div>
  <div class="ex-shot" style="position:static;max-height:70vh" tabindex="0" aria-label="Design of ${c}"><img src="s/${c}.webp" alt="Design of ${c}: ${esc(s.t)}, ${esc(s.n)}" width="${s.w}" height="${s.ht}"></div>
  <nav class="fl-nav"><button type="button" class="btn sec" data-sj="${SJ - 1}"${SJ ? '' : ' disabled'}>${ICON.back}Previous</button><button type="button" class="btn pri" data-sj="${SJ + 1}"${SJ < sc.s.length - 1 ? '' : ' disabled'}>Next${ICON.arrow}</button></nav></article></div></div>`;
}

/* ---------- requirements ---------- */
function viewReqs() {
  const order = ['3.1.1', '3.1.2', '3.1.3', '3.1.4', '3.1.5', '3.1.6', '3.1.8', '3.1.9', '3.2.1', '3.2.4', '3.6.1', '3.6.3', '3.14.8', '6.1.2', '6.1.3', '6.1.4', '6.1.5', 'D-14', 'Q-010'];
  const noReq = Object.entries(SCR).filter(([, d]) => d.nosrs);
  return `<div class="view"><header class="sec-head"><p class="eyebrow">Traceability</p><h1 class="h1">Requirements and the screens that meet them</h1><p class="lede">Every SRS item used by Sign-in and Access, quoted from the SRS, with its Final Scope feature and every screen mapped to it.</p></header>
  <div class="grid">${order.map(r => { const ids = REQ_SCREENS[r] || []; const codes = ids.flatMap(id => BYID[id]); return `<div class="req" id="${rid(r)}" style="scroll-margin-top:90px">${reqCard(r, '').replace('<div class="req">', '').replace(/<\/div>$/, '')}<div class="blk"><h2 class="bh">Screens (${ids.length}) and states (${codes.length})</h2><div class="chipline">${ids.map(id => `<span class="small" style="margin-right:4px"><b>${esc(ST[BYID[id][0]].t)}</b></span>${BYID[id].map(chip).join('')}<span class="sep">·</span>`).join('')}</div></div></div>`; }).join('')}</div>
  <section class="grid"><h2 class="h2">Screens with no SRS requirement</h2><p class="muted">Marked Needs Clarification on each screen.</p><div class="grid">${noReq.map(([id, d]) => `<p class="warn">${ICON.warn}<span><b>${esc(ST[BYID[id][0]].t)}</b> ${BYID[id].map(chip).join(' ')}: ${esc(d.nosrs)}</span></p>`).join('')}</div></section></div>`;
}

/* ---------- questions and sources ---------- */
function viewQuestions() {
  return `<div class="view"><header class="sec-head"><p class="eyebrow">Open points</p><h1 class="h1">Needs clarification and discrepancies</h1><p class="lede">${CLAR.length} points the designs and requirements don't settle. Each is marked on the screens it affects.</p></header>
  ${['differs', 'confirm', 'gap'].map(k => `<section class="grid"><h2 class="h2">${QK[k][0]}</h2><ul class="qs">${CLAR.filter(q => q[1] === k).map(q => `<li class="q" id="q-${q[0]}" style="scroll-margin-top:90px"><div class="out-h"><span class="tag ${k === 'differs' ? 'differs' : k === 'confirm' ? 'confirm' : 'gap'}">${q[0]}</span><b>${esc(q[2])}</b></div><p>${esc(q[3])}</p><div class="chipline">${q[4].map(chip).join('')}${q[5].length ? '<span class="sep">·</span>' + q[5].map(reqLink).join(' ') : ''}</div></li>`).join('')}</ul></section>`).join('')}</div>`;
}
function viewSources() {
  return `<div class="view"><header class="sec-head"><p class="eyebrow">Sources</p><h1 class="h1">Where everything comes from</h1><p class="lede">Each explanation, requirement and reference in this explorer comes from one of these. Uploaded documents have no web link, so they're named by file.</p></header>
  <div class="docs">${Object.entries(DOCS).map(([k, d]) => `<div class="docc" id="doc-${k}"><b>${esc(d.name)}</b><span class="small muted">${esc(d.file)}</span><p class="small">${esc(d.what)}</p>${d.url ? `<a class="btn sec mini" href="${d.url}" target="_blank" rel="noopener" style="justify-self:start">Open ${ICON.ext}</a>` : ''}</div>`).join('')}</div></div>`;
}

/* ---------- router ---------- */
let VIEW = '', FIRST = true;
function setTabs(t) { document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.tab === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
function route() {
  const h = decodeURIComponent(location.hash.slice(1)), m = $('#main');
  let v, html, tab, anchor = null;
  if (ST[h] || h === 'screens') { v = 'ex'; tab = 'screens'; const same = VIEW === 'ex'; CUR = ST[h] ? h : CUR; if (same) { renderExplorer(true); return; } html = viewExplorer(CUR); }
  else if (h === 'scenarios') { v = 'sc'; tab = 'scenarios'; html = viewScenarios(); }
  else if (h === 'requirements' || h.startsWith('req-')) { v = 'rq'; tab = 'requirements'; html = viewReqs(); anchor = h.startsWith('req-') ? h : null; }
  else if (h === 'questions' || h.startsWith('q-')) { v = 'qs'; tab = 'questions'; html = viewQuestions(); anchor = h.startsWith('q-') ? h : null; }
  else if (h === 'sources' || h.startsWith('doc-')) { v = 'so'; tab = 'sources'; html = viewSources(); anchor = h.startsWith('doc-') ? h : null; }
  else { v = 'ov'; tab = 'overview'; html = viewOverview(); }
  const same = v === VIEW && !anchor; VIEW = v; setTabs(tab);
  if (!same || v !== 'ex') m.innerHTML = html;
  if (anchor) { const el = document.getElementById(anchor); if (el) { el.scrollIntoView({block: 'start'}); el.setAttribute('tabindex', '-1'); el.focus({preventScroll: true}); } }
  else if (FIRST) FIRST = false;
  else { window.scrollTo(0, 0); const h1 = m.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({preventScroll: true}); } }
  FIRST = false;
}
function renderExplorer(keepList) {
  const m = $('#main'), y = $('.ex-list') ? $('.ex-list').scrollTop : 0;
  m.innerHTML = viewExplorer(CUR); VIEW = 'ex'; setTabs('screens');
  const L = $('.ex-list'); if (L && keepList) L.scrollTop = y;
  const cur = L && L.querySelector('[aria-current="true"]'); if (cur && !keepList) cur.scrollIntoView({block: 'center'});
  const h1 = $('#ex-t'); if (h1 && keepList) { h1.setAttribute('tabindex', '-1'); h1.focus({preventScroll: true}); }
  const shot = $('.ex-shot'); if (shot) shot.scrollTop = 0;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { location.hash = g.dataset.go; return; }
  const t = e.target.closest('[data-tab]'); if (t && t.closest('.tabs2')) { TAB = t.dataset.tab; $('#panel').innerHTML = panelHtml(ST[CUR]); document.querySelectorAll('.tabs2 button').forEach(b => { const on = b.dataset.tab === TAB; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; }); $('#panel').setAttribute('aria-labelledby', 'tab-' + TAB); return; }
  const f = e.target.closest('[data-lf]'); if (f) { LF = f.dataset.lf; document.querySelectorAll('[data-lf]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lf === LF)); $('#lbody').innerHTML = listHtml(); return; }
  const si = e.target.closest('[data-si]'); if (si) { SI = +si.dataset.si; SJ = 0; $('#main').innerHTML = viewScenarios(); const b = document.querySelector(`[data-si="${SI}"]`); b && b.focus(); return; }
  const sj = e.target.closest('[data-sj]'); if (sj && !sj.disabled) { SJ = +sj.dataset.sj; $('#main').innerHTML = viewScenarios(); const b = document.querySelector(`.steps [data-sj="${SJ}"]`); b && b.focus(); return; }
  const z = e.target.closest('[data-zoom]'); if (z) { const c = z.dataset.zoom, st = ST[c], d = $('#zoom'); d.innerHTML = `<div class="zoom-h"><b><code>${c}</code> ${esc(st.t)} · ${esc(st.n)}</b><button type="button" class="btn sec mini" data-zclose>Close</button></div><div class="zoom-b" tabindex="0" aria-label="Full-size design, scrolls"><img src="s/${c}.webp" alt="Design of ${c}: ${esc(st.t)}, ${esc(st.n)}" width="${st.w}" height="${st.ht}"></div>`; d.setAttribute('aria-label', 'Full-size design of ' + c); ZOP = z; d.showModal(); d.querySelector('[data-zclose]').focus(); return; }
  if (e.target.closest('[data-zclose]') || e.target.id === 'zoom') { $('#zoom').close(); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const txt = cp.dataset.copy; const done = () => { cp.textContent = 'Copied'; setTimeout(() => { cp.textContent = 'Copy'; }, 1500); }; try { navigator.clipboard.writeText(txt).then(done, () => { selectText(cp.previousElementSibling); }); } catch (er) { selectText(cp.previousElementSibling); } return; }
  const th = e.target.closest('#theme'); if (th) { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; th.textContent = dark ? 'Dark mode' : 'Light mode'; try { localStorage.setItem('siex-theme', r.dataset.theme); } catch (er) {} }
});
function selectText(el) { if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('input', e => { if (e.target.id === 'lq') { LQ = e.target.value; $('#lbody').innerHTML = listHtml(); } });
document.addEventListener('keydown', e => {
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.target.closest && e.target.closest('.tabs2') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const B = [...document.querySelectorAll('.tabs2 button')], i = B.indexOf(e.target), n = B[(i + (e.key === 'ArrowRight' ? 1 : B.length - 1)) % B.length]; n.click(); n.focus(); e.preventDefault(); return;
  }
  if (VIEW === 'ex' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const s = ST[CUR], n = STATES[s.i + (e.key === 'ArrowRight' ? 1 : -1)]; if (n) location.hash = n.c; }
  if (VIEW === 'sc' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const n = SJ + (e.key === 'ArrowRight' ? 1 : -1); if (n >= 0 && n < SCEN[SI].s.length) { SJ = n; $('#main').innerHTML = viewScenarios(); } }
});
window.addEventListener('hashchange', () => { const d = $('#zoom'); if (d.open) d.close(); route(); });
$('#zoom').addEventListener('close', () => { if (ZOP && document.contains(ZOP)) ZOP.focus(); });
try { const t = localStorage.getItem('siex-theme'); if (t) document.documentElement.dataset.theme = t; } catch (er) {}
(() => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('#theme').textContent = dark ? 'Light mode' : 'Dark mode'; })();
route();
</script>

</body></html>
