<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>AtlasIQ Milestone 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{--bg:#f3f4f6;--panel:#ffffff;--ink:#14171c;--ink2:#4a525e;--ink3:#6b7380;--line:#dfe2e7;--line2:#c9ced6;--acc:#1668c8;--acc-ink:#ffffff;--chip:#eceef2;--sel:#e7f0fb;--shadow:0 1px 2px rgba(20,23,28,.06),0 8px 24px rgba(20,23,28,.06);
  --dA:#1668c8;--dB:#0e7490;--dC:#0b6e66;--dD:#5b3fc4;--dE:#4a6a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--panel:#181b20;--ink:#eef0f3;--ink2:#b3bac5;--ink3:#8d95a1;--line:#2a2f36;--line2:#3a414a;--acc:#6aa7ee;--acc-ink:#0d1117;--chip:#22262c;--sel:#1d2a3a;--shadow:none;color-scheme:dark;
  --dA:#6aa7ee;--dB:#4cc9e8;--dC:#4fbfb2;--dD:#a99af2;--dE:#9db5cf}}
:root[data-theme="dark"]{--bg:#101215;--panel:#181b20;--ink:#eef0f3;--ink2:#b3bac5;--ink3:#8d95a1;--line:#2a2f36;--line2:#3a414a;--acc:#6aa7ee;--acc-ink:#0d1117;--chip:#22262c;--sel:#1d2a3a;--shadow:none;color-scheme:dark;
  --dA:#6aa7ee;--dB:#4cc9e8;--dC:#4fbfb2;--dD:#a99af2;--dE:#9db5cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.sh-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.sh-in{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.sh-brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.sh-brand b{font-weight:600;font-size:17px;letter-spacing:-.01em}
.sh-brand span{color:var(--ink3);font-size:14px}
.sh-grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--chip);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sh-main{padding-block:24px 64px}
.h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{color:var(--ink2);max-width:72ch;margin:8px 0 0}
.kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
/* screen view */
.sv{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;margin-top:20px}
.slist{display:flex;flex-direction:column;gap:4px;position:sticky;top:84px;align-self:start}
.slist button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px 12px;cursor:pointer}
.slist button[aria-current="true"]{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.slist .no{font:600 12px/20px 'IBM Plex Mono',monospace;color:var(--ink3)}
.slist b{display:block;font-weight:600}
.slist small{display:block;color:var(--ink3);font-size:12px;line-height:1.4}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px 8px 8px;cursor:pointer;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.opt .lt{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font:600 13px/1 'IBM Plex Mono',monospace}
.opt b{font-weight:600}
.opt small{color:var(--ink3);font-size:12px;display:block;line-height:1.2}
.sv .opt > .col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.sv .opt .col small {
  text-align: center;
}
.sv .opt .lt {
  flex-shrink: 0;
}
.stagew{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stage{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#d9dde3}
.stage>.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.about{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:16px}
.about h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.about p,.about li{margin:0;color:var(--ink2)}
.about ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.vote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.vote .lb{color:var(--ink2);margin-right:4px}
.vb{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.vb[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.vb.pick[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.nav2{display:flex;gap:8px;margin-left:auto}
.ib{border:1px solid var(--line2);background:var(--panel);border-radius:10px;min-width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;padding:0 12px}
.hint{color:var(--ink3);font-size:12px}
.states{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.states .lb{color:var(--ink3);font-size:12px;margin-right:4px}
.sb2{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.sb2[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:600}
/* directions view */
.dirs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:20px}
.dcard{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.dcard[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.dcard .sw{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.dcard .sw i{flex:1}
.dcard b{font-size:16px}
.dcard small{color:var(--ink2);font-size:13px;line-height:1.4}
.manif{margin-top:20px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.manif h2{margin:0;font-size:24px;letter-spacing:-.01em}
.spec{display:flex;flex-direction:column;gap:12px}
.spec .row{display:flex;gap:8px;flex-wrap:wrap}
.spec .chipc{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink3)}
.spec .chipc i{display:block;width:56px;height:40px;border-radius:8px;border:1px solid var(--line)}
.prin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.prin div{border-top:2px solid var(--c);padding-top:10px}
.prin b{display:block;margin-bottom:4px}
.prin span{color:var(--ink2);font-size:13px}
.dstack{display:flex;flex-direction:column;gap:28px;margin-top:24px}
.dstack h3{margin:0 0 10px;font-size:16px}
/* compare */
.mx{margin-top:20px;overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.mx table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%;table-layout:fixed}
.mx th,.mx td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.mx thead th{position:sticky;top:0;background:var(--panel);font-weight:600}
.mx th.rh{width:150px}
.mx th .lt{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:#fff;font:600 12px/1 'IBM Plex Mono',monospace;margin-right:8px}
.thumb{display:block;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#d9dde3;padding:0;position:relative}
.thumb:hover,.thumb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.thumb .scaler{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.thumb .pk{position:absolute;right:6px;top:6px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.sbs .stagew{margin-top:0}
.sbs select{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;height:36px;padding:0 8px;font:inherit}
/* feedback */
.fb{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.fbr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.fbr h3{margin:0;font-size:15px}
.fbr .opts .opt{padding:6px 12px 6px 6px;min-height:40px}
.fbr textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.fbsum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.lean{display:flex;gap:8px;flex-wrap:wrap}
.lean span{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.lean i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.btnp{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;height:40px;padding:0 16px;font-weight:600;cursor:pointer}
.btns{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;height:40px;padding:0 16px;cursor:pointer}
.toast2{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40}
@media (max-width:1100px){.dirs{grid-template-columns:repeat(2,minmax(0,1fr))}.about{grid-template-columns:minmax(0,1fr)}.manif{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.sv{grid-template-columns:minmax(0,1fr)}.slist{position:static;flex-direction:row;overflow-x:auto}.slist button{min-width:180px}.sbs{grid-template-columns:minmax(0,1fr)}.fbr{grid-template-columns:minmax(0,1fr)}.prin{grid-template-columns:minmax(0,1fr)}}

/* every design option sits in a fixed 1440 x 900 desktop frame */
.dd{width:1440px;height:900px;overflow:hidden;position:relative;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;text-align:left}
.dd *{box-sizing:border-box}
.dd button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0;text-align:inherit}
.dd input,.dd textarea{font:inherit;color:inherit}
.dd h1,.dd h2,.dd h3,.dd p,.dd ul{margin:0;padding:0}
.dd ul{list-style:none}
.dd .ic{flex:none;display:block}
.dd .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dd .cond{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif}
.dd .serif{font-family:'IBM Plex Serif',Georgia,serif}
.dd .row{display:flex;align-items:center}
.dd .col{display:flex;flex-direction:column}
.dd .grow{flex:1;min-width:0}
.dd .nw{white-space:nowrap}
.dd .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a scanned page */
.dd .pg{width:420px;height:560px;background:#fff;color:#1b2230;padding:32px;display:flex;flex-direction:column;gap:12px;flex:none}
.dd .pg-h{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid #c3cbd6;font-size:12px;line-height:16px}
.dd .pg-h b{font-weight:600}
.dd .pg-rows{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.dd .pg-r{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;font-size:12px;line-height:18px;padding:2px 6px;border-radius:4px}
.dd .pg-r span{color:#596476}
.dd .pg-r b{font-weight:600;font-family:'IBM Plex Serif',Georgia,serif;font-style:italic}
.dd .pg-l{height:8px;border-radius:4px;background:#e6e9ee;flex:none}
.dd .pg-sig{margin-top:auto;align-self:flex-end;width:170px;padding-top:6px;border-top:1px solid #7f8b9c;text-align:center;font:italic 400 13px/18px 'IBM Plex Serif',Georgia,serif;color:#596476}

/* structure shared by options B to E; each direction sets its own look on top */
.dd.v2{height:auto;min-height:900px}
.dd.v2.fix{height:900px}
.dd .k-grow{flex:1}
.dd .k-app{display:flex;flex-direction:column;min-height:900px}
.dd.fix .k-app{height:900px}
.dd .k-h{display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;flex:none}
.dd .k-wm{font-weight:600;font-size:18px;margin-right:6px}
.dd .k-ws{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;font-size:13px;font-weight:500;white-space:nowrap}
.dd .k-search{display:flex;align-items:center;gap:10px;width:440px;height:40px;padding:0 12px;font-size:14px}
.dd .k-search span{flex:1;white-space:nowrap;overflow:hidden}
.dd kbd{font:500 12px/18px 'IBM Plex Mono',monospace;padding:0 6px;border-radius:4px}
.dd .k-ib{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;flex:none}
.dd .k-ib i{position:absolute;right:3px;top:3px;min-width:16px;height:16px;border-radius:8px;font:600 11px/16px 'IBM Plex Sans';font-style:normal;text-align:center;padding:0 4px}
.dd .k-ib.sq{width:32px;height:32px}
.dd .k-me{display:flex;align-items:center;gap:10px;margin-left:6px}
.dd .k-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.dd .k-mw{display:flex;flex-direction:column}
.dd .k-mw b{font-weight:600;font-size:14px;line-height:18px}
.dd .k-mw small{font-size:12px;line-height:16px}
.dd .k-body{flex:1;display:flex;min-height:0}
.dd .k-nav{width:232px;flex:none;display:flex;flex-direction:column;gap:2px;padding:12px}
.dd .k-ng{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.dd .k-ngl{font-size:12px;font-weight:500;padding:8px 12px 4px}
.dd .k-ni{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;font-weight:500;font-size:14px;white-space:nowrap}
.dd .k-ni span{flex:1}
.dd .k-ni em{font-style:normal;font-size:12px}
.dd .k-main{flex:1;min-width:0;padding:28px 40px 40px;display:flex;flex-direction:column;gap:20px}
.dd .k-ph{display:flex;align-items:flex-start;gap:16px}
.dd .k-pht{flex:1;display:flex;flex-direction:column;gap:4px}
.dd .k-ph h1{font-size:26px;line-height:34px;font-weight:600}
.dd .k-sub{font-size:14px;line-height:20px}
.dd .k-crumb{display:flex;gap:8px;font-size:14px;margin-bottom:4px}
.dd .k-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;font-weight:500;white-space:nowrap;border-radius:8px;flex:none}
.dd .k-btn.block{width:100%;height:48px}
.dd .k-ban{display:flex;align-items:center;gap:14px;padding:14px 18px}
.dd .k-bt{display:flex;flex-direction:column;gap:2px}
.dd .k-bt b{font-weight:600}
.dd .k-ban a{font-weight:500;margin-left:16px}
.dd .k-quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dd .k-ql{font-size:12px;margin-right:6px}
.dd .k-qb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;font-weight:500;font-size:13px}
.dd .k-th{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:-8px}
.dd .k-th a{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.dd .k-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dd .k-tile{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.dd .k-tl{display:flex;align-items:center;gap:6px;font-size:13px}
.dd .k-tv{display:flex;align-items:baseline;gap:10px}
.dd .k-tv b{font-size:28px;line-height:34px;font-weight:600}
.dd .k-tv small{font-size:12px;display:inline-flex;align-items:center;gap:4px}
.dd .k-ta{display:flex;align-items:center;justify-content:space-between;font-weight:500;font-size:14px}
.dd .k-card{display:flex;flex-direction:column;gap:14px;padding:20px 22px;min-width:0}
.dd .k-card.flush{padding:0;gap:0}
.dd .k-card.flush .k-ch{padding:18px 22px 14px}
.dd .k-ch{display:flex;align-items:center;gap:8px}
.dd .k-ch h2{font-size:17px;line-height:24px;font-weight:600}
.dd .k-ch a{font-weight:500;font-size:14px}
.dd .k-n{font-size:13px}
.dd .k-cs{font-size:13px;line-height:18px;margin-top:-8px}
.dd .k-lg{display:flex;gap:16px;font-size:12px;align-items:center}
.dd .k-lg span{display:inline-flex;align-items:center;gap:6px}
.dd .k-lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dd .k-qt{width:100%;border-collapse:collapse;font-size:13px}
.dd .k-qt th{text-align:left;font-weight:500;padding:6px 0;font-size:12px}
.dd .k-qt td{padding:5px 0;height:24px}
.dd .k-qt th:nth-child(2){width:38%}
.dd .k-qt .r,.dd .k-qt th:nth-child(3),.dd .k-qt th:nth-child(4){text-align:right;width:64px}
.dd .k-bar{position:relative;display:block;height:8px;border-radius:4px;margin:0 10px}
.dd .k-bar i,.dd .k-bar em{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.dd .k-chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.dd .k-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.dd .k-col i{display:block;width:100%;border-radius:4px 4px 0 0}
.dd .k-tbl{width:100%;border-collapse:collapse;font-size:14px}
.dd .k-tbl th{text-align:left;font-weight:500;font-size:12px;height:36px;padding:0 14px}
.dd .k-tbl td{padding:9px 14px;vertical-align:middle}
.dd .k-tbl td small{display:block;font-size:12px}
.dd .k-tbl .r{text-align:right}
.dd .k-ov{display:inline-flex;align-items:center;gap:4px}
.dd .k-st{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dd .k-list{display:flex;flex-direction:column}
.dd .k-list li{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
.dd .k-list li:first-child{padding-top:0}
.dd .k-list li>.ic{margin-top:1px;flex:none}
.dd .k-lt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}

/* ================= the guidelines view in the presentation shell ================= */
.gd-sec{margin-top:28px}
.gd-h{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.gd-tw{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.gd-t{width:100%;border-collapse:collapse;min-width:720px}
.gd-t th,.gd-t td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.gd-t th{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.gd-t tr:last-child td{border-bottom:0}
.gd-t td.mono,.gd-chip .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
.gd-sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gd-ok{color:var(--ink);font-weight:500}
.gd-lo{color:var(--gd-warn);font-weight:600}
.gd-chips{display:flex;flex-direction:column;gap:8px}
.gd-chip{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.gd-chip i{grid-row:span 2;width:28px;height:28px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gd-chip small{grid-column:2/4;color:var(--ink3);font-size:12px}
.gd-g2,.gd-g3,.gd-g4{display:grid;gap:12px;margin-top:12px}
.gd-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gd-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gd-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gd-b{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.gd-b h3{margin:0 0 8px;font-size:15px}
.gd-b p{margin:0;color:var(--ink2)}
.gd-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.gd-b ul.gd-kv{list-style:none;padding:0;gap:8px}
.gd-kv li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px}
.gd-kv li:first-child{border-top:0;padding-top:0}
.gd-kv b{font-weight:600;color:var(--ink)}
.gd-kv span{text-align:right}
.gd-note{margin-top:10px!important;font-size:13px}
.gd-do{border-top:3px solid var(--gd-ok)}
.gd-dont{border-top:3px solid var(--gd-warn)}
:root{--gd-ok:#17603f;--gd-warn:#a3272f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gd-ok:#5fd4a0;--gd-warn:#ff9e9e}}
:root[data-theme="dark"]{--gd-ok:#5fd4a0;--gd-warn:#ff9e9e}
@media (max-width:1100px){.gd-g3,.gd-g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.gd-g2,.gd-g3,.gd-g4{grid-template-columns:minmax(0,1fr)}.gd-kv li{flex-direction:column;gap:2px}.gd-kv span{text-align:left}}

/* Consistent palette styling for all five options */
.dd .gs-pal {
  border-radius: 10px;
  overflow: hidden;
  clip-path: inset(0 round 10px);
  isolation: isolate;
  border: 1px solid rgba(0, 0, 0, 0.10);
}

.dd .gs-pal i {
  display: block;
  flex: 0 0 56px;
  height: 56px;
  box-shadow: none;
}
.dd .gs-ask,.dd .gs-ql{display:flex;flex-direction:column;gap:12px}
.dd .gs-ql .k-quick{flex-direction:column;align-items:flex-start}

/* level column bottoms on every home screen: rows stretch, the last card in a column takes up the remaining height */
.dd.v2 .k-main>:is(.p-g,.b-g3,.b-g3b,.b-g4,.b-g2,.b-g3p,.c-g,.d-g,.d-g3,.e-g,.e-g2){align-items:stretch}
.dd.v2 .k-main>:is(.p-g,.b-g3,.c-g,.d-g,.d-g3,.e-g)>:is(.p-c,.b-stack,.c-col,.d-col,.e-col){display:flex;flex-direction:column}
.dd.v2 .k-main>:is(.p-g,.b-g3,.c-g,.d-g,.d-g3,.e-g)>:is(.p-c,.b-stack,.c-col,.d-col,.e-col)>*{flex:1 0 auto}
.dB .b-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dd.v2 .k-main>:is(.b-g3b,.b-g4,.b-g2,.e-g2)>.k-card{height:auto}

@media (min-width: 1350px) {
  .sv .opts {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    width: 100%;
  }

  .sv .opt {
    min-width: 0;
    gap: 6px;
    padding: 8px;
  }

  .sv .opt .lt {
    flex: none;
  }

  .sv .opt .col {
    min-width: 0;
  }

  .sv .opt small {
    overflow-wrap: anywhere;
  }
}

/* ===================================================================================================
   Interaction states for both themes: hover, pressed, focus and disabled. Used by the screens and by
   the design system (where .is-hover, .is-active and .is-focus show the same states statically).
   Focus rings are 2 px with a 2 px offset in the theme's primary; disabled stays readable.
   =================================================================================================== */
.dd .k-btn{transition:background-color .12s,border-color .12s}
.dd .k-btn[disabled]{cursor:not-allowed}
.dd .k-btn:focus-visible{outline:2px solid #4338ca;outline-offset:2px}

.dD .au-tb:hover{text-decoration:underline;text-underline-offset:3px}

.dD .m2-tabs button:hover{background:#ecebf6}

.dC .k-btn.s:hover{background:#e6f1ee}
.dC .k-btn.s:active{background:#d3e8e3}
.dC .k-btn.au-danger{background:#a3272f;color:#fff}
.dC .k-btn.au-danger:hover{background:#8c1f27}
.dC .k-btn.au-danger:active{background:#741a20}
.dC .k-btn.p[disabled],.dC .k-btn.au-danger[disabled]{background:#ece7db;color:#545a55}
.dC .k-btn.s[disabled]{background:#fff;color:#545a55;border-color:#cfc8b8}
.dC .au-tb:hover{text-decoration:underline;text-underline-offset:3px}
.dC .k-ni:hover{background:#f2eee4}
.dC .m2-tabs button:hover{background:#f2eee4}
.dC .m2-tabs button.on:hover{background:#fff}
.dC .au-in:hover{border-color:#5f5a4e}
.dC .m2-sgo:hover{border-color:#0b6e66}
/* dark */
.dD.dk .k-btn:focus-visible{outline-color:#a5a1ff}
.dC.dk .k-btn:focus-visible{outline-color:#7fe3d6}

/* ===== the page around the screens (uses the page tokens defined at the top) ===== */
:root{--gT:#0b6e66;--gTint:#e6f1ee;--dT:#4338ca;--dTint:#efeafe;--ok:#1d6b45;--stage:#e9ebef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gT:#5fd3c2;--gTint:#17322f;--dT:#b3afff;--dTint:#26244a;--ok:#5ff0ae;--stage:#0b0d10}}
:root[data-theme="dark"]{--gT:#5fd3c2;--gTint:#17322f;--dT:#b3afff;--dTint:#26244a;--ok:#5ff0ae;--stage:#0b0d10}
.ls-in{max-width:1720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ls-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.ls-bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.ls-brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.ls-brand b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ls-brand span{font-size:14px;color:var(--ink2)}
.ls-tabs,.ls-mode,.ls-chips{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:10px;background:var(--chip)}
.ls-tabs button,.ls-mode button,.ls-chips button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:14px;line-height:20px}
.ls-tabs button[aria-pressed="true"],.ls-mode button[aria-pressed="true"],.ls-chips button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ls-mode button{padding:6px 10px}
.ls-mode .ic{flex:none}
.ls-mode button span{font-size:13px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* try it live */
.ls-live{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:20px;align-items:start;padding-block:20px 48px}
.ls-scen{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.ls-kick{margin:0;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.ls-sg{display:flex;flex-direction:column;gap:2px}
.ls-sgt{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink)}
.ls-dot{width:8px;height:8px;border-radius:50%;flex:none}
.ls-dot.g{background:var(--gT)}.ls-dot.d{background:var(--dT)}
.ls-sc-b{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;line-height:20px;color:var(--ink2)}
.ls-sc-b b{font-weight:500}
.ls-sc-b:hover{background:var(--chip);color:var(--ink)}
.ls-sc-b[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.ls-sc-b[aria-pressed="true"] b{font-weight:600}
.ls-stagec{min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.ls-chrome{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ls-dots{display:flex;gap:6px;flex:none}
.ls-dots i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.ls-url{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;background:var(--chip);color:var(--ink2);font:400 13px/1 'IBM Plex Mono',ui-monospace,monospace;overflow:hidden;white-space:nowrap}
.ls-url span{overflow:hidden;text-overflow:ellipsis}
.ls-url .ic{flex:none;color:var(--ok)}
.ls-theme{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.ls-theme i{width:8px;height:8px;border-radius:50%;background:currentColor}
.ls-theme.g{color:var(--gT);background:var(--gTint)}.ls-theme.d{color:var(--dT);background:var(--dTint)}
.ls-stage{position:relative;overflow:hidden;background:var(--stage)}
.ls-stage>.ls-sc,.ls-thf>.ls-sc{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0}
.ls-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.ls-btn:hover{background:var(--chip)}
.ls-btn.sm{height:28px;padding:0 10px;font-size:13px}
.ls-btn.pri{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.ls-btn[disabled]{opacity:.45;cursor:default}
.ls-dev{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow:auto}
.ls-dev>div{display:flex;flex-direction:column;gap:14px}
.ls-dev>div:empty{display:none}
.ls-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ls-ch{display:flex;align-items:center;gap:8px}
.ls-ch h2{margin:0;font-size:15px;line-height:20px;font-weight:600;flex:1;min-width:0}
.ls-p{margin:0;font-size:14px;line-height:20px;color:var(--ink2)}
.ls-p b{color:var(--ink);font-weight:600}
.ls-mute{font-size:13px;color:var(--ink3)}
.ls-tag{font-size:12px;line-height:16px;font-weight:600;color:var(--ink2);background:var(--chip);border-radius:999px;padding:2px 8px}
.ls-row{display:flex;gap:8px;flex-wrap:wrap}
.ls-creds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ls-creds li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px;line-height:18px;color:var(--ink2);min-width:0}
.ls-creds li>span{overflow-wrap:anywhere}
.ls-crh{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.ls-creds b{font-size:14px;color:var(--ink);font-weight:600}
.ls-creds code,.ls-tbl code,.ls-boxbar code,.ls-thm code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px}
.ls-creds code{color:var(--ink)}
.ls-auth{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.ls-ai{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--chip);color:var(--ink2);flex:none}
.ls-auth>div{flex:1;display:flex;flex-direction:column}
.ls-auth small{font-size:12px;color:var(--ink3)}
.ls-auth b{font:600 20px/26px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ls-feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ls-empty{font-size:13px;line-height:18px;color:var(--ink3);padding:14px;border:1px dashed var(--line2);border-radius:10px;text-align:center}
.ls-msg{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:10px;background:var(--chip)}
.ls-msg.fresh{animation:lsIn .35s ease-out}
@keyframes lsIn{from{transform:translateY(-4px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ls-msg.fresh{animation:none}}
.ls-mh{display:flex;align-items:center;gap:8px;width:100%}
.ls-mh b{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:600}
.ls-mh time{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ls-mi{display:grid;place-items:center;color:var(--ink2)}
.ls-mto{margin:0;font-size:12px;line-height:16px;color:var(--ink3);overflow-wrap:anywhere}
.ls-mb{margin:0;font-size:13px;line-height:19px;color:var(--ink2)}
.ls-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;line-height:20px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* all screens */
.ls-pad{padding-block:28px 64px}
.ls-h1{margin:0;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.ls-h2{margin:36px 0 12px;font-size:20px;line-height:28px;font-weight:600}
.ls-lede{margin:8px 0 0;max-width:80ch;color:var(--ink2);font-size:15px;line-height:22px}
.ls-chips{margin-top:18px}
.ls-sec{margin-top:32px}
.ls-sech{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ls-sech h2{margin:0;font-size:20px;line-height:28px;font-weight:600}
.ls-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;padding:3px 10px;border-radius:999px}
.ls-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ls-pill.g{color:var(--gT);background:var(--gTint)}.ls-pill.d{color:var(--dT);background:var(--dTint)}
.ls-flow{margin:20px 0 10px;font-size:14px;line-height:20px;font-weight:600;color:var(--ink2)}
.ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ls-th{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer;min-width:0}
.ls-th:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.ls-thf{position:relative;display:block;width:100%;aspect-ratio:1440/900;overflow:hidden;background:var(--stage);border-bottom:1px solid var(--line)}
.ls-thm{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.ls-thm code{color:var(--ink3)}
.ls-thm b{font-size:14px;line-height:20px;font-weight:600}
/* full-size view */

/* ===================================================================================================
   Theme guidelines: one set of standards per option, taken from the values the screens actually use.
   The sheet (DIRS.X.s.guide) is built from the same classes as the screens, so it cannot drift.
   =================================================================================================== */
const lum = h => { const c = h.replace('#', '').match(/../g).map(x => parseInt(x, 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4)); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const cr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
/* kind t = text (4.5:1 needed), n = control edge or icon (3:1 needed), s = surface (no contrast rule) */
const crTag = (k, f, b) => { if (k === 's') return ''; const r = cr(f, b), need = k === 't' ? 4.5 : 3; return `${r.toFixed(1)}:1 ${r >= (k === 't' ? 7 : need) && k === 't' ? 'AAA' : r >= need ? 'AA' : 'Below ' + need + ':1'}`; };

  team: (t, foot = '') => K.card(t.t, t.n, t.link, `<table class="k-tbl"><thead><tr>${t.cols.map((c, i) => `<th class="${i && i < 5 ? 'r' : ''}">${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr><td><a>${r[0]}</a><small>Reviewer</small></td><td class="r">${r[1]}</td><td class="r">${r[2]}</td><td class="r">${r[3] ? `<span class="k-ov">${ic('clock', 14)}${r[3]}</span>` : '-'}</td><td class="r">${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table>${foot ? `<div class="ai-foot">${foot}</div>` : ''}`, 'k-team flush'),

  prov: (p = CX.prov) => K.card(p.t, p.n, p.link, `<table class="k-tbl p-prov"><thead><tr>${p.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${p.rows.map(([n, r, s, v, m, d]) => `<tr><td><a>${n}</a><small>${r}</small>${n === 'Harbor View Home Health' ? AI.line('Falling 3 months in a row', '', 'Accuracy: 78% in July, 74% in August, 69% in September and 66% so far in October. Most of the drop is visit notes without a recipient signature (D18).') : ''}</td><td>${P.st(s)}</td><td>${P.accCell(v, p.goal)}</td><td>${m}</td><td>${d}</td></tr>`).join('')}</tbody></table><div class="ai-foot">${AI.note(AIC.cu.trend, 'ai-in')}</div>`, 'flush p-provc'),

  askPanel: (c = PV.chat) => `<section class="d-q p-dq"><div class="p-dqh"><span class="d-tag">${ic('sparkle', 14)}${c.t}</span><small>${AIC.pv.chat[1]}</small></div>${P.askBox(c)}${P.link(c.person, 'user')}</section>`

/* ---------- the five screens, in every option ---------- */
(() => {
  const col = (cls, ...x) => `<div class="${cls}">${x.join('')}</div>`;
  const S = AIC.sv, R = AIC.rv;

  /* A · Clarity: R1, SV-01 and RV-01 rebuilt live in the finalized design system, with Stella's work beside the data it explains */
  const aApp = (role, main) => K.app(role, 'home', main).replace('class="k-app"', 'class="k-app p-app a-home"').replace(/(<a class="k-ni on">)/, '$1<i class="p-mk"></i>');
  DIRS.A.img = 0;
  DIRS.A.s.reg = () => `<div class="a-reg"><aside class="a-rl"><span class="k-wm">AtlasIQ</span><h2>${REG.title}</h2>${K.steps()}${K.ready()}<span class="k-grow"></span><div class="a-art" aria-hidden="true"><i class="a-art1"></i><i class="a-art2"><b></b><b></b><b></b><b></b><b></b><b></b></i></div>${K.regFoot()}</aside><section class="a-rr"><div class="a-rhp">${K.regHelp()}</div><div class="a-rfw">${K.regForm()}</div></section></div>`;

  DIRS.A.s.rv = () => aApp('rv', `${K.ph(RV)}${K.banner(RV.banner)}${K.quick(RV.quick)}${K.tilesHead(RV)}${K.tiles(RV)}<div class="a-r a-r2 a-cols">${col('a-c', K.wip(RV.wip, R), K.due(RV.due), K.msgs())}${col('a-c', K.alerts(R.found), K.res(), K.sys(), K.ann())}</div>`);
  DIRS.A.s.pv = () => P.app(PV, `${P.ph(PV)}${P.banner(PV.banner, 'clock')}${K.quick(PV.quick)}${K.tilesHead(PV)}${P.tiles(PV)}<div class="p-g">${col('p-c', P.need(), P.dec(), P.acc(), P.alerts(), P.reps())}${col('p-c', P.chat(), P.look(), P.letters(), P.ups(), P.train(), P.sup())}</div>`);
  DIRS.A.s.cu = () => P.app(CX, `${P.ph(CX)}${P.banner(CX.banner, 'target')}${K.quick(CX.quick)}${K.tilesHead(CX)}${P.tiles(CX)}<div class="p-g">${col('p-c', P.chart(), P.cletters())}${col('p-c', P.attn(), P.reports(), P.docs())}</div>${P.prov()}<div class="p-g">${col('p-c', P.conc(), P.edu())}${col('p-c', P.sla(), P.team())}</div>`);

  /* B · Command: Stella's work as compact signals inside the board, and an Ask command in the Ctrl K bar */
  const ob = {key: 'Ctrl K', logo: '<span class="k-wm"><i class="b-lg">A</i>AtlasIQ</span>'};
  const homeB = (role, X, main, check) => K.app(role, 'home', `${K.ph(X)}${check ? `<div class="ai-pair">${K.banner(X.banner)}${check}</div>` : K.banner(X.banner)}${K.quick(X.quick)}${K.tilesHead(X)}${K.tiles(X)}${main}`, ob);
  DIRS.B.s.sv = () => homeB('sv', SV, `${K.pipe(SV.queues)}<div class="b-g3">${col('b-stack', K.teamBars(SV.team, AI.note(S.plan, 'ai-in')), K.chart(SV.chart))}${col('b-stack', K.alerts(S.found), K.dl(SV.dl), K.accts(SV.accts))}</div><div class="b-g4">${K.msgs()}${K.ann()}${K.sys()}${K.res()}</div>`, AI.note(S.check));
  DIRS.B.s.rv = () => homeB('rv', RV, `<div class="b-g3">${col('b-stack', K.wip(RV.wip, R, 'col'), K.ann(), K.msgs())}${col('b-stack', K.due(RV.due), K.alerts(R.found))}</div><div class="b-g2">${K.sys()}${K.res()}</div>`);
  const topB = X => `${P.ph(X)}${P.banner(X.banner, X === PV ? 'clock' : 'target')}${K.quick(X.quick)}${K.tilesHead(X)}${P.tiles(X)}`;
  DIRS.B.s.pv = () => P.app(PV, `${topB(PV)}<div class="b-g3">${col('b-stack', P.need(), P.dec(), P.acc())}${col('b-stack', P.chat(), P.letters(), P.alerts(), P.ups(), P.reps())}</div><div class="b-g3b">${P.train()}${P.look()}${P.sup()}</div>`, ob);
  DIRS.B.s.cu = () => P.app(CX, `${topB(CX)}${P.prov()}<div class="b-g3">${col('b-stack', P.chart(), P.conc(), P.cletters())}${col('b-stack', P.attn(), P.sla(), P.reports())}</div><div class="b-g3b">${P.edu()}${P.docs()}${P.team()}</div>`, ob);

  /* C · Guided: AtlasIQ explains in plain words, on the teal tint, right after the step it helps with */
  const oc = {logo: '<span class="k-wm"><i class="c-mk"></i>AtlasIQ</span>'};
  const heroC = X => `<section class="c-hero"><div class="c-hl">${ic('layers', 22)}<div><b>${X.banner[0]}</b><small>${X.banner[1]}</small></div></div><div class="c-ha"><button type="button" class="k-btn w">${X.banner[2][0]}${ic('arrow', 18)}</button><a>${X.banner[2][1]}</a></div></section>`;
  const headC = (X, after = '') => `<div class="c-top"><div class="k-ph"><div class="k-pht"><p class="c-k">${X.sub.split(' · ')[0]}</p><h1>${X.title}</h1><p class="k-sub">${X.sub.split(' · ').slice(1).join(' · ')}</p></div><button type="button" class="k-btn p">${ic(X.primary[0], 18)}${X.primary[1]}</button></div>${heroC(X)}${after}${K.quick(X.quick)}</div>`;

  qr() {
    let s = '', seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const N = 25, c = 6;
    const finder = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="currentColor"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="currentColor"/>`;
    const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > 0.52) s += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}"/>`;
    return `<span class="au-qr" role="img" aria-label="QR code for AtlasIQ"><svg viewBox="0 0 ${N * c} ${N * c}" width="150" height="150" fill="currentColor">${s}${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg></span>`;

function helpFor(id, v) {
  const m = v.modal || '';
  const keys = [];
  if (m) keys.push(id + '@' + m, id + '@' + m.split('-')[0]);
  if (v.kind) keys.push(id + '#' + v.kind);
  if (v.orphan) keys.push(id + '#orphan');
  const st = {'c-intake': S.file.st === 'fail' && 'fail', 'c-concern': !S.cc.some(c => c.st === 'open') && 'done', 'g-up2': (v.files || []).length && 'files', 'g-home': S.up.st === 'sent' && 'sent', 'c-sep': S.sep === 'done' && 'done', 'c-review': v.tab && v.tab !== 'q' && v.tab, 'c-return': S.ret.st !== 'waiting' && S.ret.st, 'c-pdqa': S.pdq === 'corrected' && 'done',
    'c-release': S.rel.den === 'released' && S.rel.fin === 'released' && (S.riv === 'none' || S.riv === 'posted') && 'done'}[id];
  if (st && !m) keys.push(id + '#' + st);
  if (v.mode === 'compare' || (id === 'c-qa' && S.qa2 === 'compare')) keys.push(id + '#compare');
  keys.push(id);
  for (const k of keys) if (HELP2[k]) return HELP2[k];
  return null;
}

  return `<section class="ls-card"><div class="ls-ch"><h2>Controls</h2><span class="ls-tag">Simulated</span></div><p class="ls-p">It's ${M.time()} on Friday, October 23. ${st}</p><div class="ls-row">${S.ret.st === 'waiting' ? `<button type="button" class="ls-btn" data-ui="clock" data-v="run"${lines ? '' : ' disabled'}>Run the 6 PM return</button><button type="button" class="ls-btn" data-ui="clock" data-v="fail"${lines ? '' : ' disabled'}>Make it fail</button>` : ''}${S.ret.st === 'sent' ? '<button type="button" class="ls-btn" data-ui="clock" data-v="confirm">NC Tracks email arrives</button>' : ''}${S.ret.st !== 'waiting' ? '<button type="button" class="ls-btn" data-ui="go" data-v="c-return">Open the return</button>' : ''}</div>${lines ? '' : '<p class="ls-small2">Release letters first: a claim goes back only when its letter is posted.</p>'}</section>`;
}
function feedHtml() {
  if (!LIVE.feed.length) return '<li class="ls-empty">Emails, alerts and messages appear here as you work.</li>';
  return LIVE.feed.map(m => `<li class="ls-msg${m.fresh ? ' fresh' : ''}"><div class="ls-mh"><span class="ls-mi">${ic(m.kind === 'mail' ? 'mail' : m.kind === 'alert' ? 'bell' : 'info', 16)}</span><b>${ae(m.title)}</b><time>${m.time}</time></div><p class="ls-mb">${ae(m.body)}</p></li>`).join('');
}

/* every state in flow order */
function viewScreens() {
  const list = M2_SECTIONS.filter(s => UI.sec === 'all' || s.key === UI.sec);
  const nG = M2_ALL.filter(x => x.theme === 'G').length, nD = M2_ALL.length - nG;
  return `<div class="ls-in ls-pad"><h1 class="ls-h1">Every screen and state</h1><p class="ls-lede">${M2_ALL.length} states in workflow order: ${nD} in Copilot for CQH staff and ${nG} in Guided for providers. Each group follows the 16 Milestone 2 steps; open a state to see it full size, step through them in order, or try it live.</p>` +
    `<div class="ls-chips" role="group" aria-label="Show"><button type="button" class="ls-chip" aria-pressed="${UI.sec === 'all'}" data-ui="sec" data-v="all">All</button>${M2_SECTIONS.map(s => `<button type="button" class="ls-chip" aria-pressed="${UI.sec === s.key}" data-ui="sec" data-v="${s.key}">${s.name}</button>`).join('')}</div>` +
    list.map(sec => `<section class="ls-sec"><h2 class="ls-h2">${sec.name}</h2><p class="ls-mute">${sec.steps}</p><div class="ls-grid">${M2_ALL.filter(x => x.sec === sec.key).map(x => `<button type="button" class="ls-th" data-ui="open" data-v="${x.key}"><span class="ls-thf" data-thumb="${x.key}"><span class="ls-sc"></span></span><span class="ls-thm"><code>${x.code}</code><b>${x.name}</b></span></button>`).join('')}</div></section>`).join('') + '</div>';
}
/* the flow guide: one point per screen */
function viewGuide() {
  return `<div class="ls-in ls-pad ls-guide"><h1 class="ls-h1">Flow guide</h1><p class="ls-lede">Which screen comes next, and why, from Sunday's NC Tracks file to NC Tracks' final decision. The Figma file uses the same order and codes. Copilot codes start with C, Guided codes with G.</p>` +
    M2_SECTIONS.map(sec => `<section class="ls-gsec"><h2 class="ls-h2">${sec.name}</h2><p class="ls-mute">${sec.steps}</p><ol class="ls-gl">${M2_ALL.filter(x => x.sec === sec.key).map(x => `<li><button type="button" class="ls-gcode ${x.theme === 'G' ? 'g' : 'd'}" data-ui="open" data-v="${x.key}">${x.code}</button><div><b>${x.name}</b><span>${x.why}</span></div></li>`).join('')}</ol></section>`).join('') + '</div>';
}
const DECIDE2 = [
  ['Records requests go through Release', 'Original and final records requests wait for a supervisor\'s release with a sample check, like the denial letters (as in the approved supervisor home). Please confirm, or they can post on their own within 48 hours.'],
  ['Complete lines move to review straight away', 'Lines evaluated complete move to review (Part A) as soon as they\'re evaluated; lines with missing records wait for the final request (Part B).'],
  ['A final request date that lands on a holiday', 'Batch 10/19/2026\'s 15th calendar day is Veterans Day, so the final request posts the business day before (Tue, Nov 10). Please confirm with CQH.'],
  ['Letters say "upload to the portal"', 'Fax and mail aren\'t in Milestone 2, so the template line "using the portal or by fax" reads "upload to the portal". CQH approves template wording.'],
  ['File limits (6.6.1)', 'Shown as PDF, TIFF, JPG, PNG, Word and Excel, up to 100 MB a file, no page limit. The size is a placeholder until confirmed.'],
  ['Resolution strings', 'Shown in the format of the F-03 sample record. The exact override and denial instructions are confirmed with GDIT.'],
  ['Outside checks (Q-038)', 'DPS and HCPR shown as links with a recorded answer; automated lookups would fill the same answer.'],
  ['NC Tracks outcomes (Q-034, Q-035)', 'Shown as weekly remittance results recorded against each returned line, until the method is decided.'],
  ['Correcting a denial after NC Tracks has decided (3.16.3)', 'Shown as: correct in AtlasIQ, draft a corrected letter and ask NC Medicaid to reprocess. Method to confirm.'],
  ['Placeholder values', 'QA sampling (10% a week, at least 2, first 90 days, authenticity flags, IRR 5%), response-time targets and the $10.00 low-dollar threshold.']
];
function viewScope() {
  const groups = ['Claim journey', 'Setup and access', 'Connections', 'Platform and quality'];
  const codeOf = k => (M2_ALL.find(x => x.key === k) || {}).code;
  const cell = keys => keys.length ? keys.map(codeOf).filter(Boolean).join(', ') : '-';
  return `<div class="ls-in ls-pad"><h1 class="ls-h1">Scope coverage</h1><p class="ls-lede">All 106 requirements in the Milestone 2 mapping sheet, grouped as in the sheet, with their step, coverage and the screens that cover them. ${M2_REQS.filter(r => r[3] === 'Partial').length} are only partly in Milestone 2; what's in is shown, and what's left is named.</p>` +
    groups.map(g => { const L = M2_REQS.filter(r => r[4] === g); return `<h2 class="ls-h2">${g} <span class="ls-mute">· ${L.length}</span></h2><div class="ls-tw"><table class="ls-tbl"><thead><tr><th scope="col">SRS ID</th><th scope="col">Requirement</th><th scope="col">Step</th><th scope="col">Coverage</th><th scope="col">How the screens cover it</th><th scope="col">Screens</th></tr></thead><tbody>${L.map(([id, t, step, cov, gr, note, how, keys]) => `<tr><td><code>${id}</code></td><td><b>${t}</b>${note ? `<small>In Milestone 2: ${note}</small>` : ''}</td><td>${step}</td><td><span class="ls-cov ${cov === 'Full' ? 'f' : 'p'}">${cov}</span></td><td>${how}</td><td class="ls-nw">${cell(keys)}</td></tr>`).join('')}</tbody></table></div>`; }).join('') +
    `<h2 class="ls-h2">Decisions to confirm</h2><div class="ls-dec">${DECIDE2.map(([t, d], i) => `<section class="ls-card"><div class="ls-ch"><span class="ls-num">${i + 1}</span><h2>${t}</h2></div><p class="ls-p">${d}</p></section>`).join('')}</div><p class="ls-note">All people, agencies, recipients and numbers are synthetic sample data. Dates follow the NC prepay timeline from a Friday, October 23, 2026 "today".</p></div>`;
}
const GUIDE_ORDER = M2_ALL;
function boxHtml() {
  const i = GUIDE_ORDER.findIndex(x => x.key === UI.box), x = GUIDE_ORDER[i];
  if (!x) return '';
  return `<div class="ls-box" role="dialog" aria-modal="true" aria-label="${ae(x.code + ' ' + x.name)}"><div class="ls-boxbar"><code>${x.code}</code><b>${x.name}</b><span class="ls-mute">${x.secName}</span><span class="ls-grow"></span><button type="button" class="ls-btn" data-ui="boxstep" data-v="-1" ${i ? '' : 'disabled'} aria-label="Previous state">‹</button><button type="button" class="ls-btn" data-ui="boxstep" data-v="1" ${i < GUIDE_ORDER.length - 1 ? '' : 'disabled'} aria-label="Next state">›</button><button type="button" class="ls-btn pri" data-ui="trylive" data-v="${x.key}">Try it live</button><button type="button" class="ls-btn" data-ui="boxclose" aria-label="Close">Close</button></div><p class="ls-boxwhy">${x.why}</p><div class="ls-boxs"><div class="ls-stage" id="ls-boxst"><div class="ls-sc">${m2Static(x, isDark() ? 'dark' : 'light')}</div></div></div></div>`;
}

let LSIO = null;
function draw() {
  document.body.classList.toggle('ls-dk', isDark()); saveUI();
  const v = {live: viewLive, screens: viewScreens, guide: viewGuide, scope: viewScope}[UI.view]();
  $('#app').innerHTML = topBar() + `<main id="ls-main">${v}</main>`;
  if (UI.view === 'live') { drawLive(false); drawSide(); }
  if (UI.view === 'screens') thumbs();
}
function thumbs() {
  if (LSIO) LSIO.disconnect();
  const fill = el => { if (el.dataset.done === (isDark() ? 'd' : 'l')) return; const x = M2_ALL.find(y => y.key === el.dataset.thumb); el.firstElementChild.innerHTML = m2Static(x, isDark() ? 'dark' : 'light'); el.dataset.done = isDark() ? 'd' : 'l'; el.firstElementChild.style.transform = `scale(${el.clientWidth / 1440})`; };
  const els = document.querySelectorAll('[data-thumb]');
  if ('IntersectionObserver' in window) { LSIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) fill(e.target); }), {rootMargin: '400px'}); els.forEach(e => LSIO.observe(e)); } else els.forEach(fill);
}
function drawLive(scrollTop) {
  const f = $('#ls-frame'); if (!f) return;
  const a = document.activeElement, fid = a && f.contains(a) ? a.id : null, sel = fid && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  f.innerHTML = liveHtml(); scaleBox($('#ls-stage'));
  const u = $('#ls-url'); if (u) u.innerHTML = `${ic('lock', 14)}<span>atlasiq.cqh.org/${M2S[LIVE.id].path}</span>`;
  const th = $('#ls-theme'), t = M2S[LIVE.id].t; if (th) { th.className = 'ls-theme ' + (t === 'G' ? 'g' : 'd'); th.innerHTML = `<i></i>${THEME2[t][0]} · ${THEME2[t][1]}`; }
  if (fid) { const n = document.getElementById(fid); if (n) { n.focus({preventScroll: true}); if (sel && n.setSelectionRange) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  else if (scrollTop) { const st = $('#ls-stage'); const r = st.getBoundingClientRect(); if (r.top < 0) window.scrollBy(0, r.top - 80); const m = f.querySelector('.au-mod'); if (m) { const b = m.querySelector('input, select, textarea, button'); if (b) b.focus({preventScroll: true}); } else { const h = f.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({preventScroll: true}); } } }
}
function drawSide() {
  const g = $('#ls-guide'); if (!g) return;
  g.innerHTML = guideCard(); $('#ls-help').innerHTML = helpCard(); $('#ls-ctl').innerHTML = ctlCard(); $('#ls-feed').innerHTML = feedHtml();
  $('#ls-n').textContent = LIVE.feed.length ? LIVE.feed.length + (LIVE.feed.length === 1 ? ' item' : ' items') : '';
  LIVE.feed.forEach(m => { m.fresh = false; });
}
LIVE.onChange = nav => { if (UI.view !== 'live') return; drawLive(nav); drawSide(); };
LIVE.toast = t => { const e = document.createElement('div'); e.className = 'ls-toast'; e.setAttribute('role', 'status'); e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3600); };

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const u = ev.target.closest('[data-ui]');
  if (u) {
    const v = u.dataset.v;
    switch (u.dataset.ui) {
      case 'view': UI.view = v; UI.box = null; draw(); window.scrollTo(0, 0); return;
      case 'mode': UI.mode = v; draw(); return;
      case 'sec': UI.sec = v; draw(); return;
      case 'scen': m2Start(v); document.querySelectorAll('.ls-sc-b').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); return;
      case 'restart': if (LIVE.scen) m2Start(LIVE.scen); else { S = M2_BASE(); LIVE.feed = []; m2Go('c-intake', {}); } return;
      case 'go': m2Go(v); return;
      case 'hl': { const h = helpFor(LIVE.id, LIVE.v), sel = h && h[1][+v] && h[1][+v][1]; const f = $('#ls-frame');
        let el = null; if (sel) { try { el = f.querySelector(sel) || document.querySelector(sel); } catch (e) {} }
        document.querySelectorAll('.ls-hl').forEach(n => n.classList.remove('ls-hl'));
        if (!el) { LIVE.toast('That control appears once you\'ve done the step before it.'); return; }
        el.classList.add('ls-hl'); el.scrollIntoView({block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
        setTimeout(() => el.classList.remove('ls-hl'), 2600); return; }
      case 'clock':
        if (v === 'run') { S.clock = 18 * 60; m2Op('ret-run'); feed('alert', 'Return sent to NC Tracks', 'CCME.PREPAY.RESP.D261023 sent at 6:00 PM. Waiting for the confirmation email.'); }
        if (v === 'fail') { S.clock = 18 * 60; m2Op('ret-fail'); feed('alert', 'Return failed', 'The GDIT SFTP server refused the connection at 6:00 PM. Interface team and Priya Shah alerted; retrying at 6:15 PM.'); }
        if (v === 'confirm') { S.clock = 21 * 60 + 12; m2Op('ret-confirm'); feed('mail', 'NC Tracks confirmation read by Stella', 'All lines in CCME.PREPAY.RESP.D261023 were received and accepted for processing. Counts match.'); }
        m2Go(v === 'confirm' ? 'c-mailbox' : 'c-return'); return;
      case 'open': UI.box = v; $('#app').insertAdjacentHTML('beforeend', boxHtml()); scaleBox($('#ls-boxst')); { const cb = document.querySelector('.ls-box [data-ui=boxclose]'); if (cb) cb.focus(); } return;
      case 'boxstep': { const i = GUIDE_ORDER.findIndex(x => x.key === UI.box) + +v; if (GUIDE_ORDER[i]) { UI.box = GUIDE_ORDER[i].key; const b = document.querySelector('.ls-box'); b.outerHTML = boxHtml(); scaleBox($('#ls-boxst')); const n = document.querySelector(`.ls-box [data-ui=boxstep][data-v="${v}"]`); if (n && !n.disabled) n.focus(); } return; }
      case 'boxclose': UI.box = null; document.querySelector('.ls-box').remove(); return;
      case 'trylive': { const x = M2_ALL.find(y => y.key === v); UI.box = null; UI.view = 'live'; LIVE.scen = null; LIVE.feed = []; S = M2_BASE(); x.ops.forEach(m2Op); draw(); LIVE.v = JSON.parse(JSON.stringify(x.v)); LIVE.id = x.id; drawLive(true); drawSide(); window.scrollTo(0, 0); return; }
    }
    return;
  }
  const fr = ev.target.closest('#ls-frame'); if (!fr) return;
  const a = ev.target.closest('[data-act]');
  if (a && fr.contains(a)) {
    if (a.tagName === 'INPUT') return;
    if (a.tagName === 'A' || a.tagName === 'BUTTON') ev.preventDefault();
    if (a.disabled) return;
    const k = a.dataset.act;
    if (ACT[k]) ACT[k](a.dataset.arg, a); else if (k) later();
    return;
  }
  const lnk = ev.target.closest('a[href="#"], a:not([href]), button');
  if (lnk && !ev.target.closest('label')) { ev.preventDefault(); if (lnk.closest('.ai-note, .d-brief, .ai-next, .k-ban, .k-quick, .k-ta, .k-ch, .k-th')) later(); }
});
document.addEventListener('input', ev => { const el = ev.target; if (!el.closest || !el.closest('#ls-frame') || !el.dataset.bind) return; m2Bind(el); if (el.tagName === 'TEXTAREA' || (el.type !== 'checkbox' && el.type !== 'radio')) return; m2Render(); });
document.addEventListener('change', ev => { const el = ev.target; if (!el.closest || !el.closest('#ls-frame') || !el.dataset.bind) return; m2Bind(el); m2Render(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (UI.box) { UI.box = null; const b = document.querySelector('.ls-box'); if (b) b.remove(); return; } if (UI.view === 'live' && LIVE.v.modal) { closeModal(); return; } }
  if (UI.box && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { const b = document.querySelector(`[data-ui=boxstep][data-v="${ev.key === 'ArrowRight' ? 1 : -1}"]`); if (b && !b.disabled) b.click(); return; }
  if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('#ls-frame') && ev.target.matches('input[type=text], input:not([type])')) { ev.preventDefault(); const f = $('#ls-frame'); const b = f.querySelector('.au-mod .k-btn.p') || [...f.querySelectorAll('.k-btn.p')].find(x => !x.disabled); if (b) b.click(); }
  /* arrow keys move between tabs */
  if ((ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && ev.target.getAttribute && ev.target.getAttribute('role') === 'tab') { const L = [...ev.target.parentElement.querySelectorAll('[role=tab]')], i = L.indexOf(ev.target), n = L[(i + (ev.key === 'ArrowRight' ? 1 : L.length - 1)) % L.length]; n.focus(); n.click(); }
});
window.addEventListener('resize', () => { if (UI.view === 'live') scaleBox($('#ls-stage')); if (UI.box) scaleBox($('#ls-boxst')); if (UI.view === 'screens') document.querySelectorAll('[data-thumb]').forEach(el => { if (el.firstElementChild.firstElementChild) el.firstElementChild.style.transform = `scale(${el.clientWidth / 1440})`; }); });
if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (UI.mode === 'system') draw(); });
/* used by the Figma export and the checks */
window.__m2 = (key, mode) => { const x = M2_ALL.find(y => y.key === key); const f = document.getElementById('frame'); f.innerHTML = m2Static(x, mode); return x.code; };
LIVE.id = 'c-intake'; LIVE.v = {};
draw();

</script>
